<script>
    /* --- Asset Preloader --- */
    const ASSET_BASE_URL = "https://lawbrewing.github.io/DreadmoorGames/TaproomDefender/assets/";
    
    // Key-Map for Assets
    const imageSources = {
        beers: ASSET_BASE_URL + "beers.png",
        food: ASSET_BASE_URL + "food.png",     // NEW: Replaces Pretzel/Curd
        oldtimer: ASSET_BASE_URL + "oldtimer.png",
        vip: ASSET_BASE_URL + "vip.png",
        boss: ASSET_BASE_URL + "bosstimer.png"
    };

    /* --- SCALING CONFIGURATION --- */
    // Adjust these numbers to scale assets up (>1.0) or down (<1.0)
    const ASSET_SCALES = {
        BEER: 0.1,      // Scale for Beers
        FOOD: 0.1,      // Scale for Pretzels/Curds
        VIP: 1,       // Scale for the VIP Table
        OLDTIMER: 1,  // Scale for the Thief
        BOSS: 1       // Scale for the Boss Timer
    };

    const assets = {};
    const imagesToLoad = Object.keys(imageSources).length;
    let loadedCount = 0;

    const enterBtn = document.getElementById('enter-btn');

    function onAssetEvent() {
        loadedCount++;
        if (loadedCount === imagesToLoad) {
            enableGame();
        }
    }

    function enableGame() {
        enterBtn.disabled = false;
        enterBtn.innerText = "ENTER TAPROOM";
    }

    setTimeout(() => {
        if (enterBtn.disabled) {
            console.log("Forcing start due to slow assets");
            enableGame();
        }
    }, 3000);

    for (const [key, src] of Object.entries(imageSources)) {
        const img = new Image();
        img.onload = onAssetEvent;
        img.onerror = onAssetEvent;
        img.src = src;
        assets[key] = img;
    }

    /* --- Sound System & Background Music --- */
    let audioCtx = null;
    
    const musicMain = new Audio('https://lawbrewing.github.io/LawBrewing/hard-rock-guitar-loop-2-289430.mp3');
    musicMain.loop = true;
    musicMain.volume = 0.6; 
    
    const musicBoss = new Audio('https://lawbrewing.github.io/LawBrewing/guitar-riff2-451160.mp3');
    musicBoss.loop = true;
    musicBoss.volume = 0.6;
    
    let currentTrack = musicMain;

    function initAudio() {
        try {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        } catch (e) {
            console.log("Audio not supported or blocked");
        }
    }
    
    function switchMusic(trackName) {
        musicMain.pause();
        musicBoss.pause();
        
        if (trackName === 'boss') {
            currentTrack = musicBoss;
        } else {
            currentTrack = musicMain;
        }
        
        currentTrack.currentTime = 0;
        if (isPlaying && !isPaused) {
            currentTrack.play().catch(e => {});
        }
    }

    function playSound(type) {
        if (!audioCtx || audioCtx.state === 'suspended') return;

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        const now = audioCtx.currentTime;

        if (type === 'shoot') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(600, now);
            osc.frequency.exponentialRampToValueAtTime(100, now + 0.1);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
            osc.start(now);
            osc.stop(now + 0.1);
        } 
        else if (type === 'explosion') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(100, now);
            osc.frequency.exponentialRampToValueAtTime(10, now + 0.2);
            gain.gain.setValueAtTime(0.5, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
            osc.start(now);
            osc.stop(now + 0.2);
        }
        else if (type === 'healthUp') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(400, now);
            osc.frequency.linearRampToValueAtTime(600, now + 0.1);
            osc.frequency.linearRampToValueAtTime(1000, now + 0.3);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
            osc.start(now);
            osc.stop(now + 0.4);
        }
        else if (type === 'score') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, now);
            osc.frequency.exponentialRampToValueAtTime(1200, now + 0.1);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
            osc.start(now);
            osc.stop(now + 0.5);
        } 
        else if (type === 'vipCatch') {
            osc.type = 'triangle'; 
            osc.frequency.setValueAtTime(523.25, now); 
            osc.frequency.linearRampToValueAtTime(1046.50, now + 0.1); 
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6); 
            osc.start(now);
            osc.stop(now + 0.6);
        }
        else if (type === 'bonus') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(1000, now);
            osc.frequency.setValueAtTime(1500, now + 0.1);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
            osc.start(now);
            osc.stop(now + 0.3);
        }
        else if (type === 'megaBonus') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(1200, now);
            osc.frequency.linearRampToValueAtTime(1800, now + 0.1);
            osc.frequency.linearRampToValueAtTime(1200, now + 0.2);
            osc.frequency.linearRampToValueAtTime(2000, now + 0.3);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
            osc.start(now);
            osc.stop(now + 0.4);
        }
        else if (type === 'streak') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(400, now);
            osc.frequency.linearRampToValueAtTime(800, now + 0.15);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
            osc.start(now);
            osc.stop(now + 0.15);
        }
        else if (type === 'error') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.linearRampToValueAtTime(150, now + 0.2);
            gain.gain.setValueAtTime(0.5, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
            osc.start(now);
            osc.stop(now + 0.2);
        }
        else if (type === 'toxicTheft') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(100, now);
            osc.frequency.linearRampToValueAtTime(50, now + 0.3);
            gain.gain.setValueAtTime(0.5, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
            osc.start(now);
            osc.stop(now + 0.4);
        }
        else if (type === 'gameover') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(300, now);
            osc.frequency.linearRampToValueAtTime(50, now + 1);
            gain.gain.setValueAtTime(0.5, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 1);
            osc.start(now);
            osc.stop(now + 1);
        }
    }

    /* --- Simpleboards Configuration --- */
    const SIMPLEBOARDS_API_KEY = "78098c7b-fa9d-4ce1-9300-a56d081d53c4";
    const SIMPLEBOARDS_LEADERBOARD_ID = "9f649aa6-f553-4a57-57a6-08de2efe707f";
    const SIMPLEBOARDS_BASE_URL = "https://api.simpleboards.dev/api"; 

    /* --- Game Setup --- */
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    // UI Elements
    const landingPage = document.getElementById('landing-page');
    const startScreen = document.getElementById('start-screen');
    const gameOverScreen = document.getElementById('game-over-screen');
    const pauseScreen = document.getElementById('pause-screen');
    const hud = document.getElementById('hud');
    const pauseOverlay = document.getElementById('pause-overlay');
    const livesContainer = document.getElementById('lives-container');
    const lastCallVignette = document.getElementById('last-call-vignette');
    const eventNotify = document.getElementById('event-notify');
    const bossTimerDisplay = document.getElementById('boss-timer-display');
    
    const scoreEl = document.getElementById('score');
    const levelEl = document.getElementById('level'); 
    const finalScoreEl = document.getElementById('final-score');
    const streakWrapper = document.getElementById('streak-wrapper');
    const streakDisplay = document.getElementById('streak-display');
    const streakVal = document.getElementById('streak-val');
    
    const startBtn = document.getElementById('start-btn');
    const restartBtn = document.getElementById('restart-btn');
    const menuBtn = document.getElementById('menu-btn');
    const pauseBtn = document.getElementById('pause-btn');
    const resumeBtn = document.getElementById('resume-btn');
    const quitBtn = document.getElementById('quit-btn');
    
    const levelTransitionEl = document.getElementById('level-transition'); 
    const levelTitleEl = document.getElementById('level-title');
    const levelSubtextEl = document.getElementById('level-subtext');
    
    // Leaderboard Elements
    const leaderboardBtn = document.getElementById('leaderboard-btn');
    const leaderboardModal = document.getElementById('leaderboard-modal');
    const leaderboardBody = document.getElementById('leaderboard-body');
    const leaderboardStatus = document.getElementById('leaderboard-status');
    const closeLeaderboardBtn = document.getElementById('close-leaderboard-btn');
    
    // Name Input Elements
    const nameInputModal = document.getElementById('name-input-modal');
    const inputFinalScoreEl = document.getElementById('input-final-score');
    const nameInput = document.getElementById('name-input');
    const submitNameBtn = document.getElementById('submit-name-btn');

    /* --- Level Configuration --- */
    const levelsConfig = [
        { scoreToClear: 1000, spawnIntervalMs: 1500, speedMultiplier: 1.0, thiefSpawnMs: 999999, vipActive: false }, 
        { scoreToClear: 3000, spawnIntervalMs: 1200, speedMultiplier: 1.3, thiefSpawnMs: 7000, vipActive: false }, 
        { scoreToClear: 15000, spawnIntervalMs: 1000, speedMultiplier: 1.6, thiefSpawnMs: 6000, vipActive: true },
        // Level 4 is BOSS MODE
    ];

    // Game State
    let isPlaying = false;
    let isPaused = false;
    let score = 0;
    let displayScore = 0; // 2. Rolling Score Counter
    let streak = 0; 
    let lives = 3;
    let currentLevel = 1;
    let lastTime = 0;
    
    // Guaranteed Drops State
    let hasSpawnedPretzelLevel3 = false;
    let hasSpawnedCurdLevel3 = false;

    // Boss State
    let isBossMode = false;
    let bossInstance = null;
    let bossCountdown = 0;
    let bossWarmup = false;

    // Double Bubble State
    let isDoubleBubble = false;
    let doubleBubbleTimer = 0;

    // Screen Shake State
    let shakeDuration = 0;
    let shakeIntensity = 0;

    // Player/VIP State
    let playerGuestX = window.innerWidth / 2;
    let vipInstance;  
    let isMovingGuest = false;

    // Spawning/Difficulty variables
    let spawnTimer = 0;
    let spawnInterval = levelsConfig[0].spawnIntervalMs; 
    let speedMultiplier = levelsConfig[0].speedMultiplier;
    
    let thiefSpawnTimer = 0;
    let thiefSpawnInterval = levelsConfig[0].thiefSpawnMs; 

    let isTransitioning = false;
    
    // Arrays for entities
    let beers = [];
    let particles = [];
    let clickEffects = [];
    let thieves = []; 
    let pretzels = [];
    let curds = [];

    /* --- Resize Handling --- */
    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        playerGuestX = canvas.width / 2;
        if (vipInstance) {
            vipInstance.y = canvas.height - 100;
        }
    }
    window.addEventListener('resize', resize);
    resize();

    /* --- Screen Shake Function --- */
    function triggerShake(duration, intensity) {
        shakeDuration = duration;
        shakeIntensity = intensity;
    }

    /* --- SAFE SPAWN LOGIC (Enhanced for Overlap Prevention) --- */
    function getSafeSpawnX() {
        const padding = 50; // Increased padding from edge
        const minDistance = 100; // Minimum horizontal distance between ANY falling item
        let attempts = 0;
        let valid = false;
        let x = 0;

        while (!valid && attempts < 20) {
            x = Math.random() * (canvas.width - padding * 2) + padding;
            valid = true;

            // Check against BEERS
            for (let b of beers) {
                if (Math.abs(b.x - x) < minDistance) {
                    valid = false;
                    break;
                }
            }
            // Check against PRETZELS
            if (valid) {
                for (let p of pretzels) {
                    if (Math.abs(p.x - x) < minDistance) {
                        valid = false;
                        break;
                    }
                }
            }
            // Check against CURDS
             if (valid) {
                for (let c of curds) {
                    if (Math.abs(c.x - x) < minDistance) {
                        valid = false;
                        break;
                    }
                }
            }
            attempts++;
        }

        return valid ? x : null;
    }

    /* --- Input Handling --- */
    const handleShootInput = (x, y) => {
        if (!isPlaying || isTransitioning || isPaused) return;

        // If the tap/click is in the VIP control zone (bottom 1/3), don't shoot!
        if (y > canvas.height * 0.7) { 
            return;
        }

        playSound('shoot'); 
        clickEffects.push({x, y, age: 0});

        // 1. Thieves
        for (let i = thieves.length - 1; i >= 0; i--) {
            const t = thieves[i];
            const dist = Math.hypot(t.x - x, t.y - y);
            
            if (dist < t.size / 2) { 
                t.isHit = true;
                if (!isDoubleBubble) { // Invincible during Double Bubble
                      loseLife();
                }
                playSound('explosion'); 
                triggerShake(10, 5); 
                createFloatingText(t.x, t.y, "DEAD TIMER", "red");
                createExplosion(t.x, t.y, '#fdbd9c', 'circle');
                streak = 0; 
                updateStreakDisplay();
                checkGameOver();
                return;
            }
        }

        // 2. Pretzels & Curds (Destroy if shot)
        for (let i = pretzels.length - 1; i >= 0; i--) {
            const p = pretzels[i];
            if (Math.hypot(p.x - x, p.y - y) < 30) {
                createExplosion(p.x, p.y, '#8b4513', 'square');
                pretzels.splice(i, 1);
                return; 
            }
        }
        for (let i = curds.length - 1; i >= 0; i--) {
             const c = curds[i];
            if (Math.hypot(c.x - x, c.y - y) < 30) {
                createExplosion(c.x, c.y, '#fcd34d', 'circle');
                curds.splice(i, 1);
                return; 
            }
        }

        // 3. Beers
        let hitBeer = false;
        for (let i = beers.length - 1; i >= 0; i--) {
            const b = beers[i];
            const dist = Math.hypot(b.x - x, b.y - y);
            
            if (dist < 40) {
                hitBeer = true;
                // Green swill logic removed - all BAD beers are targets
                if (b.type === 'BAD') {
                    // CORRECT ACTION: Shoot the Swill
                    let shardCols = ['#9ca3af', '#4b5563', '#ef4444'];
                    createExplosion(b.x, b.y, shardCols, 'square'); 
                    beers.splice(i, 1);
                    triggerShake(5, 2); 
                    
                    streak++;
                    let multiplier = 1 + (Math.floor(streak / 3) * 0.2);
                    let points = Math.floor(100 * multiplier);
                    let text = `+${points}`;
                    let soundType = 'explosion';

                    if (b.y < canvas.height / 3) {
                        points += 25;
                        text = "EARLY BIRD! " + text;
                        soundType = 'bonus';
                    }

                    if (streak > 2 && soundType === 'explosion') {
                        soundType = 'streak';
                        text += ` (x${multiplier.toFixed(1)})`;
                    }

                    score += points;
                    // Score rendering happens in gameLoop now
                    updateStreakDisplay();
                    playSound(soundType); 
                    // 1. Floating Score Text -> spawn at Beer Location (b.x, b.y)
                    createFloatingText(b.x, b.y, text, "#ffff00"); // Yellow text
                    checkLevelUp();
                } else {
                    // INCORRECT ACTION: Shot the Law Brew
                    if (b.isSpecial) {
                        createFloatingText(b.x, b.y, "WASTED GOLD!", "red");
                    } else {
                        createFloatingText(b.x, b.y, "WASTED BREW!", "red");
                    }

                    playSound('error'); 
                    triggerShake(15, 8); 
                    createExplosion(b.x, b.y, '#d97706', 'circle');
                    beers.splice(i, 1);
                    
                    // Penalty applies even in Double Bubble (player fault)
                    loseLife(); 
                    
                    streak = 0; 
                    updateStreakDisplay();
                    checkGameOver();
                }
                return; 
            }
        }
        
        if (!hitBeer) {
            streak = 0;
            updateStreakDisplay();
        }
    };

    function updateStreakDisplay() {
        streakVal.innerText = streak;
        
        // 3. Hot Streak Visuals
        if (streak >= 5) {
            streakWrapper.classList.add('hot-streak');
        } else {
            streakWrapper.classList.remove('hot-streak');
        }

        if (streak > 1) {
            streakDisplay.style.opacity = 1;
        } else {
            streakDisplay.style.opacity = 0;
        }
    }

    /* --- Input Handlers for VIP Movement --- */

    const handleGuestMoveStart = (x, y) => {
        if (y > canvas.height * 0.7) {
            isMovingGuest = true;
        }
    };

    const handleGuestMove = (x) => {
        if (isMovingGuest && isPlaying && !isTransitioning && !isPaused) {
            const minX = 60;
            const maxX = canvas.width - 60;
            playerGuestX = Math.min(Math.max(x, minX), maxX);
        }
    };

    const handleGuestMoveEnd = () => {
        isMovingGuest = false;
    };

    // MOUSE EVENTS
    canvas.addEventListener('mousedown', (e) => {
        initAudio(); // Safe to call here
        if (e.clientY > canvas.height * 0.7) {
             handleGuestMoveStart(e.clientX, e.clientY);
        } else {
            handleShootInput(e.clientX, e.clientY);
        }
    });

    canvas.addEventListener('mousemove', (e) => {
        handleGuestMove(e.clientX);
    });

    canvas.addEventListener('mouseup', handleGuestMoveEnd);
    canvas.addEventListener('mouseleave', handleGuestMoveEnd);

    // TOUCH EVENTS
    canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        initAudio(); // Safe to call here
        const x = e.touches[0].clientX;
        const y = e.touches[0].clientY;
        
        if (y > canvas.height * 0.7) {
            handleGuestMoveStart(x, y); 
        } else {
            handleShootInput(x, y);
        }
    }, {passive: false});

    canvas.addEventListener('touchmove', (e) => {
        e.preventDefault();
        handleGuestMove(e.touches[0].clientX);
    }, {passive: false});

    canvas.addEventListener('touchend', handleGuestMoveEnd);

    // KEYBOARD EVENTS
    window.addEventListener('keydown', (e) => {
        if (e.key === 'p' || e.key === 'P') {
            togglePause();
        }
    });

    /* --- Classes --- */

    class Boss {
        constructor() {
            this.width = 150 * ASSET_SCALES.BOSS; 
            this.height = 150 * ASSET_SCALES.BOSS;
            this.x = canvas.width / 2;
            this.y = 80; 
            this.vx = 5; 
            this.spawnTimer = 0;
        }
        update(dt) {
            this.x += this.vx;
            if (this.x < 50 || this.x > canvas.width - 50) this.vx *= -1;
            
            // Spawn Swill FAST (every 600ms)
            this.spawnTimer += dt;
            if (this.spawnTimer > 600) { 
                 // Cap at 5 items on screen during Boss Wave
                 if (beers.length < 5) {
                     const b = new Beer(5, this.x);
                     // Boss items fall 1.2x faster
                     b.speed *= 1.2;
                     b.type = 'BAD'; 
                     beers.push(b);
                 }
                 this.spawnTimer = 0;
            }
        }
        draw(ctx) {
            if (!assets.boss) return;
            ctx.save();
            ctx.drawImage(assets.boss, this.x - this.width/2, this.y - this.height/2, this.width, this.height);
            ctx.restore();
        }
    }

    class CheeseCurd {
        constructor(x) {
            this.x = x;
            this.y = -50;
            const baseSpeed = canvas.height / 500;
            this.speed = (baseSpeed * speedMultiplier) * 1.0;
        }
        update() {
            this.y += this.speed;
        }
        draw(ctx) {
            if (!assets.food) return;
            ctx.save();
            ctx.translate(this.x, this.y);

            // Frame 1 = Cheese Curd
            const frameWidth = assets.food.width / 2;
            const frameHeight = assets.food.height;
            
            // Scaling
            const drawW = frameWidth * ASSET_SCALES.FOOD;
            const drawH = frameHeight * ASSET_SCALES.FOOD;

            // Draw right half of food.png
            ctx.drawImage(
                assets.food,
                frameWidth, 0, frameWidth, frameHeight, // Source (Right half)
                -drawW/2, -drawH/2, drawW, drawH
            );

            ctx.restore();
        }
    }

    class Pretzel {
        constructor(x) {
            this.x = x;
            this.y = -50;
            this.radius = 25;
            const baseSpeed = canvas.height / 500; 
            this.speed = (baseSpeed * speedMultiplier) * 1.2; 
            this.rotation = 0;
            this.rotSpeed = 0.05;
        }
        update() {
            this.y += this.speed;
            this.rotation += this.rotSpeed;
        }
        draw(ctx) {
            if (!assets.food) return;
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(this.rotation);
            
            // Frame 0 = Pretzel
            const frameWidth = assets.food.width / 2;
            const frameHeight = assets.food.height;
            
            // Scaling
            const drawW = frameWidth * ASSET_SCALES.FOOD;
            const drawH = frameHeight * ASSET_SCALES.FOOD;

            // Draw left half of food.png
            ctx.drawImage(
                assets.food,
                0, 0, frameWidth, frameHeight, // Source (Left half)
                -drawW/2, -drawH/2, drawW, drawH
            );

            ctx.restore();
        }
    }

    class Beer {
        constructor(level, x, isSpecial = false) {
            this.radius = 30;
            this.isSpecial = isSpecial;
            
            // Animation props
            this.frame = 0;
            this.frameTimer = 0;
            this.animationSpeed = 150; // ms per frame

            if (this.isSpecial) {
                this.type = 'GOOD';
                this.initialX = x;
                this.x = this.initialX;
            } else {
                this.x = x;
                let isBad = Math.random() > 0.35; 
                if (isBad) {
                    this.type = 'BAD';
                } else {
                    this.type = 'GOOD'; 
                }
            }
            
            this.y = -50;
            this.initialX = this.x; 
            
            const baseSpeed = canvas.height / 500; 
            let s = (baseSpeed * speedMultiplier) * (1 + Math.random() * 0.4);
            
            this.speed = s;
            this.rotation = 0;
            this.rotSpeed = (Math.random() - 0.5) * 0.1;
        }

        update(dt) {
            this.y += this.speed;
            
            // Standard Spirals
            if (this.isSpecial) {
                this.x = this.initialX + Math.sin(this.y * 0.05) * 30;
                 if (this.isSpecial && Math.random() > 0.8) {
                    particles.push(new Particle(this.x, this.y, '#ffd700', 'circle'));
                }
            } 
            // DOUBLE BUBBLE: Drunken Movement for EVERYTHING
            else if (isDoubleBubble) {
                 this.x = this.initialX + Math.sin(this.y * 0.05) * 20;
            }
            
            this.rotation += this.rotSpeed;

            // Animate Frame
            this.frameTimer += dt;
            if (this.frameTimer > this.animationSpeed) {
                this.frame = (this.frame + 1) % 3; // 3 Frames per row
                this.frameTimer = 0;
            }
        }

        draw(ctx) {
            if (!assets.beers) return; // Asset safety

            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(this.rotation);

            // Sprite Sheet Logic
            const frameWidth = assets.beers.width / 3;
            const frameHeight = assets.beers.height / 2;
            
            let row = (this.type === 'GOOD') ? 0 : 1;
            let col = this.frame;

            if (this.isSpecial) {
                 // Gold glow under texture
                 ctx.shadowColor = "gold";
                 ctx.shadowBlur = 15;
            }
            
            // Scaling
            const drawW = frameWidth * ASSET_SCALES.BEER;
            const drawH = frameHeight * ASSET_SCALES.BEER;

            ctx.drawImage(
                assets.beers,
                col * frameWidth, row * frameHeight, frameWidth, frameHeight,
                -drawW/2, -drawH/2, drawW, drawH
            );

            ctx.restore();
        }
    }

    class PatronRaider { 
        constructor() {
            this.size = 50;
            const minSpawnY = canvas.height * 0.25; 
            const maxSpawnY = canvas.height * 0.60;
            this.y = minSpawnY + Math.random() * (maxSpawnY - minSpawnY);

            if (Math.random() < 0.5) {
                this.x = -this.size;
                this.vx = 0.5 + Math.random() * 0.5 * speedMultiplier;
                this.side = 'left';
            } else {
                this.x = canvas.width + this.size;
                this.vx = -(0.5 + Math.random() * 0.5 * speedMultiplier);
                this.side = 'right';
            }
            this.vy = 0.1 + Math.random() * 0.1 * speedMultiplier; 
            this.isHit = false;
            this.life = 100;
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;
            if (this.isHit) this.life -= 3;
        }

        draw(ctx) {
            if (!assets.oldtimer) return;
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.globalAlpha = this.life / 100;
            
            // Scale Image
            const drawSize = 70 * ASSET_SCALES.OLDTIMER;

            // Double Bubble Shield
            if (isDoubleBubble) {
                ctx.strokeStyle = '#fcd34d';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(0, 0, drawSize/2 + 5, 0, Math.PI * 2);
                ctx.stroke();
            }

            ctx.shadowColor = "white"; ctx.shadowBlur = 10;

            // Flip Logic: Image faces RIGHT
            // If moving LEFT (vx < 0), Flip it.
            if (this.vx < 0) {
                ctx.scale(-1, 1);
            }

            ctx.drawImage(assets.oldtimer, -drawSize/2, -drawSize/2, drawSize, drawSize);
            
            ctx.shadowBlur = 0;
            ctx.globalAlpha = 1.0;
            ctx.restore();
        }
    }

    class Particle {
        constructor(x, y, color, shape) {
            this.x = x; this.y = y; this.color = color;
            this.shape = shape || 'circle';
            const angle = Math.random() * Math.PI * 2;
            const speed = Math.random() * 5 + 2;
            this.vx = Math.cos(angle) * speed;
            this.vy = Math.sin(angle) * speed;
            this.life = 1.0;
            this.decay = Math.random() * 0.03 + 0.02;
            this.size = Math.random() * 4 + 2;
            this.rotation = Math.random() * Math.PI;
            this.rotSpeed = (Math.random() - 0.5) * 0.2;
        }
        update() {
            this.x += this.vx; this.y += this.vy; this.vy += 0.2;
            this.life -= this.decay;
            this.rotation += this.rotSpeed;
        }
        draw(ctx) {
            ctx.save();
            ctx.globalAlpha = Math.max(0, this.life);
            ctx.fillStyle = this.color;
            ctx.translate(this.x, this.y);
            ctx.rotate(this.rotation);
            if (this.shape === 'square') {
                ctx.fillRect(-this.size, -this.size, this.size*2, this.size*2);
            } else {
                ctx.beginPath();
                ctx.arc(0, 0, this.size, 0, Math.PI*2);
                ctx.fill();
            }
            ctx.restore();
        }
    }

    // 2. Floating Score Text Logic
    class FloatingText {
        constructor(x, y, text, color) {
            this.x = x; 
            this.y = y; 
            this.text = text; 
            this.color = color;
            this.life = 1.0; 
            this.vy = -3; // Float up speed
        }
        update() { 
            this.y += this.vy; 
            this.life -= 0.02; 
        }
        draw(ctx) {
            ctx.save();
            ctx.globalAlpha = Math.max(0, this.life);
            ctx.fillStyle = this.color;
            ctx.font = "bold 24px 'Roboto Slab'";
            ctx.textAlign = 'center';
            ctx.shadowColor = 'black';
            ctx.shadowBlur = 4;
            ctx.fillText(this.text, this.x, this.y);
            ctx.strokeStyle = 'black';
            ctx.lineWidth = 1;
            ctx.strokeText(this.text, this.x, this.y);
            ctx.restore();
        }
    }

    function transitionToLevel(newLevel) {
        isTransitioning = true;
        beers = []; thieves = []; pretzels = []; curds = [];
        spawnTimer = 0; thiefSpawnTimer = 0; 
        streak = 0;
        updateStreakDisplay();
        
        let titleText, subText;

        // BOSS LEVEL CHECK (Level 4)
        if (newLevel === 4) {
            titleText = "BOSS WAVE";
            subText = "SURVIVE FOR 15 SECONDS!";
            levelEl.textContent = "BOSS";
            isBossMode = true;
            bossCountdown = 15; // 15 seconds
            bossInstance = new Boss();
            bossTimerDisplay.style.display = 'block';
            bossTimerDisplay.innerText = bossCountdown;
            // Warmup State Start
            bossWarmup = true;
        }
        else if (newLevel <= levelsConfig.length) {
            // Standard Levels 1-3
            const cfg = levelsConfig[newLevel - 1];
            titleText = `LEVEL ${newLevel}`;
            if (cfg.vipActive) {
                subText = "VIP IS NOW ACTIVE! CATCH LAW BREWS!";
                vipInstance.isVipActive = true;
            } else if (newLevel === 2) {
                subText = "HERE COMES THE OLD TIMER!";
                vipInstance.isVipActive = false;
            } else {
                subText = "FASTER!";
                vipInstance.isVipActive = false;
            }
            spawnInterval = cfg.spawnIntervalMs;
            speedMultiplier = cfg.speedMultiplier;
            thiefSpawnInterval = cfg.thiefSpawnMs;
            levelEl.textContent = newLevel;
            isBossMode = false;
        } else {
            // Level 5+ is Expert Mode
            titleText = `EXPERT MODE`;
            subText = "SURVIVE";
            spawnInterval = 500;
            speedMultiplier = 3.0;
            thiefSpawnInterval = 3000;
            vipInstance.isVipActive = true; 
            levelEl.textContent = 'E';
            isBossMode = false;
        }
        
        levelTitleEl.textContent = titleText;
        levelSubtextEl.textContent = subText;
        levelTransitionEl.classList.add('show-transition');

        // Text Transition Logic
        setTimeout(() => {
            levelTransitionEl.classList.remove('show-transition');
            
            // If it is Boss Level, we move to "Warmup" instead of playing immediately
            if (newLevel === 4) {
                levelTitleEl.textContent = "GET READY!";
                levelSubtextEl.textContent = "MOVE VIP NOW!";
                levelTransitionEl.classList.add('show-transition');
                
                // Switch music IMMEDIATELY on notification
                switchMusic('boss');
                
                // Keep transitioning logic true so normal spawns don't start, but allow movement
                isTransitioning = false; 
                
                setTimeout(() => {
                    levelTransitionEl.classList.remove('show-transition');
                    bossWarmup = false; // FIGHT STARTS
                    createFloatingText(canvas.width/2, canvas.height/2, "SURVIVE!", "red");
                }, 3000); // 3s warmup
            } else if (newLevel === 5) {
                switchMusic('main'); // Back to main loop
                isTransitioning = false;
            } else {
                isTransitioning = false;
            }
        }, 2500);
    }

    async function fetchLeaderboard() {
        leaderboardBody.innerHTML = '';
        leaderboardStatus.textContent = 'Loading...';
        let data = []; let usedSource = 'API';
        try {
            const response = await fetch(`${SIMPLEBOARDS_BASE_URL}/leaderboards/${SIMPLEBOARDS_LEADERBOARD_ID}/entries`, { headers: { 'x-api-key': SIMPLEBOARDS_API_KEY } });
            if (!response.ok) throw new Error("API Fetch failed");
            const jsonData = await response.json();
            data = Array.isArray(jsonData) ? jsonData : (jsonData.entries || []);
        } catch (error) {
            usedSource = 'Local';
            const localData = localStorage.getItem('law_leaderboard');
            if (localData) { data = JSON.parse(localData); }
        }
        if (!data || data.length === 0) {
            leaderboardStatus.textContent = `No scores yet (${usedSource}). Be the first!`;
            return;
        }
        leaderboardStatus.textContent = `Top Scores (${usedSource})`;
        const standardizedData = data.map(entry => ({ name: entry.playerDisplayName || entry.name || "Anonymous", score: Number(entry.score) || 0 }));
        standardizedData.sort((a, b) => b.score - a.score);
        standardizedData.slice(0, 10).forEach((entry, index) => {
            const row = leaderboardBody.insertRow();
            row.insertCell(0).textContent = index + 1;
            row.insertCell(1).textContent = entry.name;
            row.insertCell(2).textContent = entry.score.toLocaleString();
        });
    }
    
    async function submitScore(name, score) {
        const sanitizedName = name.trim().toUpperCase() || "ANONYMOUS";
        submitNameBtn.textContent = "Submitting..."; submitNameBtn.disabled = true;
        const payload = { leaderboardId: SIMPLEBOARDS_LEADERBOARD_ID, playerDisplayName: sanitizedName, score: score.toString() };
        try {
            await fetch(`${SIMPLEBOARDS_BASE_URL}/entries`, {
                method: 'POST', headers: { 'Content-Type': 'application/json', 'x-api-key': SIMPLEBOARDS_API_KEY }, body: JSON.stringify(payload)
            });
        } catch (error) {
            let localScores = JSON.parse(localStorage.getItem('law_leaderboard')) || [];
            localScores.push({ name: sanitizedName, score: score }); 
            localScores.sort((a, b) => b.score - a.score);
            localScores = localScores.slice(0, 10);
            localStorage.setItem('law_leaderboard', JSON.stringify(localScores));
        }
        submitNameBtn.textContent = "Submit Score"; submitNameBtn.disabled = false;
        showGameOverScreen();
    }

    function gameLoop(timestamp) {
        if (!isPlaying || isPaused) return;

        const dt = timestamp - lastTime;
        lastTime = timestamp;

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        ctx.save();
        if (shakeDuration > 0) {
            const dx = (Math.random() - 0.5) * shakeIntensity;
            const dy = (Math.random() - 0.5) * shakeIntensity;
            ctx.translate(dx, dy);
            shakeDuration--;
        }

        // --- 1. ROLLING SCORE LOGIC ---
        if (displayScore < score) {
            let diff = score - displayScore;
            // Add a chunk based on distance (easing), minimum 1 to ensure it finishes
            let step = Math.ceil(diff * 0.1); 
            displayScore += step;
            scoreEl.innerText = displayScore.toLocaleString();
        } else if (displayScore > score) {
            // If score went down (penalty), update immediately or roll down faster
            displayScore = score;
            scoreEl.innerText = displayScore.toLocaleString();
        }

        // --- DOUBLE BUBBLE LOGIC ---
        if (isDoubleBubble) {
            doubleBubbleTimer -= dt;
            ctx.fillStyle = 'rgba(252, 211, 77, 0.1)'; // Golden tint
            ctx.fillRect(0,0,canvas.width, canvas.height);
            
            if (doubleBubbleTimer <= 0) {
                isDoubleBubble = false;
                
                // EXPLODE EVERYTHING
                beers.forEach(b => {
                    let color = (b.type === 'BAD') ? '#9ca3af' : '#d97706';
                    createExplosion(b.x, b.y, color, 'square');
                });
                thieves.forEach(t => createExplosion(t.x, t.y, '#fdbd9c', 'circle'));
                pretzels.forEach(p => createExplosion(p.x, p.y, '#8b4513', 'square'));
                curds.forEach(c => createExplosion(c.x, c.y, '#fcd34d', 'circle'));

                // Audio & Visual feedback
                playSound('explosion'); 
                triggerShake(15, 10); 

                // Clear arrays
                beers = [];
                pretzels = [];
                curds = [];
                thieves = [];
            }
        }

        // --- BOSS MODE LOGIC ---
        if (isBossMode) {
            
            // Draw Boss Always (Idle or Active)
            if (bossInstance && assets.boss) {
                // Only update position if NOT warmup
                if (!bossWarmup) bossInstance.update(dt);
                bossInstance.draw(ctx);
            }

            // Only run timer if NOT warmup
            if (!bossWarmup) {
                if (bossCountdown > 0) {
                       bossCountdown -= dt / 1000;
                       if (bossCountdown < 0) bossCountdown = 0;
                       bossTimerDisplay.innerText = Math.ceil(bossCountdown);
                }

                if (bossCountdown <= 0) {
                    // BOSS DEFEATED
                    isBossMode = false;
                    bossTimerDisplay.style.display = 'none';
                    createFloatingText(canvas.width/2, canvas.height/2, "BOSS DEFEATED!", "gold");
                    playSound('megaBonus');
                    // Transition to Level 5 (Expert)
                    currentLevel++; 
                    transitionToLevel(currentLevel);
                }
            }
        }

        // Spawning (Only if NOT transitioning)
        // If we are in Boss Warmup, we skip spawning entirely
        if (!isTransitioning && !bossWarmup) {
            // Boss spawns handle themselves in bossInstance.update()
            
            // Standard Spawning (Only if NOT Boss Mode)
            if (!isBossMode) {
                spawnTimer += dt;
                let spawnCap = isDoubleBubble ? 999 : 3; 
                let currentInterval = isDoubleBubble ? 300 : spawnInterval;

                // --- DYNAMIC DIFFICULTY FOR LEVEL 3 ---
                if (currentLevel === 3 && !isDoubleBubble) {
                    const startScore = 300; 
                    const endScore = 500; 
                    // TEST MODE logic for Difficulty Scaling:
                    const progress = Math.min(Math.max((score - 100) / (500 - 100), 0), 1); 

                    // Interpolate difficulty parameters
                    // Spawn Interval: 1000 -> 600
                    currentInterval = 1000 - (progress * 400);
                    // Speed: 1.6 -> 2.5
                    speedMultiplier = 1.6 + (progress * 0.9);
                    // Thief Interval: 6000 -> 3000
                    thiefSpawnInterval = 6000 - (progress * 3000);
                }

                if (spawnTimer > currentInterval) {
                    // Try to spawn if we are under the cap
                    if (beers.length < spawnCap) {
                        let safeX = getSafeSpawnX();
                        if (safeX !== null) {
                             beers.push(new Beer(currentLevel, safeX));
                        }
                    }
                    
                    // --- POWER-UP SPAWNING (Level 3 Only) ---
                    // Rates Increased for testing/visibility: Pretzel 4%, Curd 3%
                    if (!isDoubleBubble && currentLevel === 3) {
                        // Pretzel Logic
                        if (Math.random() < 0.04) {
                            let safeX = getSafeSpawnX();
                            if (safeX !== null) { 
                                pretzels.push(new Pretzel(safeX));
                                hasSpawnedPretzelLevel3 = true;
                            }
                        }
                        // Curd Logic
                        if (Math.random() < 0.03) {
                            let safeX = getSafeSpawnX();
                            if (safeX !== null) {
                                curds.push(new CheeseCurd(safeX));
                                hasSpawnedCurdLevel3 = true;
                            }
                        }

                        // --- GUARANTEED DROP LOGIC (Scaled for Test) ---
                        // Pretzel at 350
                        if (score > 350 && !hasSpawnedPretzelLevel3) {
                             let safeX = getSafeSpawnX();
                             if (safeX !== null) {
                                 pretzels.push(new Pretzel(safeX));
                                 hasSpawnedPretzelLevel3 = true;
                                 console.log("Force spawned Pretzel (Bad Luck Protection)");
                             }
                        }
                        // Curd at 450
                        if (score > 450 && !hasSpawnedCurdLevel3) {
                             let safeX = getSafeSpawnX();
                             if (safeX !== null) {
                                 curds.push(new CheeseCurd(safeX));
                                 hasSpawnedCurdLevel3 = true;
                                 console.log("Force spawned Curd (Bad Luck Protection)");
                             }
                        }
                    }

                    spawnTimer = 0;
                }
                
                // Thieves (Level 2+)
                if (!isDoubleBubble && currentLevel >= 2) {
                    thiefSpawnTimer += dt;
                    if (thiefSpawnTimer > thiefSpawnInterval) {
                        thieves.push(new PatronRaider());
                        thiefSpawnTimer = 0;
                    }
                }
            }
        }

        // VIP Guest (Level 3+)
        if (vipInstance) {
            vipInstance.update();
            if (vipInstance.isVipActive && assets.vip) {
                vipInstance.draw(ctx);
                
                // VIP Collision BEER
                for (let j = beers.length - 1; j >= 0; j--) {
                    const b = beers[j];
                    if (b.x > vipInstance.x - 40 && b.x < vipInstance.x + 40 && 
                        b.y > vipInstance.y - 40 && b.y < vipInstance.y + 20) {
                        
                        beers.splice(j, 1);
                        
                        if (b.type === 'GOOD') {
                            let pts = 500;
                            if (b.isSpecial) {
                                pts = 1000;
                                playSound('megaBonus');
                                createFloatingText(vipInstance.x, vipInstance.y - 60, "GOLDEN BREW! +1 LIFE", "#ffd700");
                                gainLife();
                            } else {
                                playSound('vipCatch'); 
                                createFloatingText(vipInstance.x, vipInstance.y - 60, "VIP LAW BONUS!", "#d946ef");
                            }
                            score += pts;
                            createSparkle(b.x, b.y);
                        } 
                        else {
                            if (!isDoubleBubble) loseLife();
                            createFloatingText(vipInstance.x, vipInstance.y - 60, isDoubleBubble ? "SHIELDED!" : "VIP SWILL HIT!", isDoubleBubble ? "#fcd34d" : "red");
                            if(!isDoubleBubble) playSound('error'); 
                            triggerShake(10, 5); 
                            createExplosion(b.x, b.y, '#ef4444', 'square'); 
                            streak = 0; 
                            updateStreakDisplay();
                            checkGameOver();
                        }
                    }
                }
                
                // VIP Collision PRETZEL -> Trigger Happy Hour
                for (let j = pretzels.length - 1; j >= 0; j--) {
                    const p = pretzels[j];
                    if (p.x > vipInstance.x - 40 && p.x < vipInstance.x + 40 && p.y > vipInstance.y - 40 && p.y < vipInstance.y + 20) {
                        pretzels.splice(j, 1);
                        startHappyHour();
                    }
                }
                
                // VIP Collision CURDS -> Trigger Double Bubble
                for (let j = curds.length - 1; j >= 0; j--) {
                    const c = curds[j];
                    if (c.x > vipInstance.x - 40 && c.x < vipInstance.x + 40 && c.y > vipInstance.y - 40 && c.y < vipInstance.y + 20) {
                        curds.splice(j, 1);
                        startDoubleBubble();
                    }
                }
            }
        }

        // Entities Loop
        for (let i = beers.length - 1; i >= 0; i--) {
            const b = beers[i];
            b.update(dt);
            b.draw(ctx);
            if (b.y > canvas.height) {
                beers.splice(i, 1);
                if (b.isSpecial) continue; 
                if (b.type === 'GOOD') {
                    let pts = 50; score += pts; 
                    // Floating text for caught beer
                    createFloatingText(b.x, canvas.height - 50, "LAW BREW SERVED", "lime");
                    playSound('score'); 
                } else {
                    // Swill hit bottom
                    // If Double Bubble: Penalty points but NO life lost
                    if (isDoubleBubble) {
                        score -= 100;
                        createFloatingText(b.x, canvas.height - 50, "-100", "orange");
                    } else {
                        loseLife();
                        createFloatingText(b.x, canvas.height - 50, "SWILL SERVED!", "orange");
                        playSound('error'); 
                        streak = 0; updateStreakDisplay();
                    }
                    checkGameOver();
                    triggerShake(10, 5);
                }
            }
        }

        for (let i = pretzels.length - 1; i >= 0; i--) {
            const p = pretzels[i]; p.update(); p.draw(ctx);
            if (p.y > canvas.height) pretzels.splice(i, 1);
        }
        for (let i = curds.length - 1; i >= 0; i--) {
            const c = curds[i]; c.update(); c.draw(ctx);
            if (c.y > canvas.height) curds.splice(i, 1);
        }

        for (let i = thieves.length - 1; i >= 0; i--) {
            const t = thieves[i]; t.update(dt); t.draw(ctx);
            if (t.x < -t.size * 2 || t.x > canvas.width + t.size * 2 || t.life <= 0) { thieves.splice(i, 1); }
            
            for (let j = beers.length - 1; j >= 0; j--) {
                const b = beers[j];
                if (Math.hypot(t.x - b.x, t.y - b.y) < 50) {
                    if (b.type === 'GOOD') continue;
                    else {
                        beers.splice(j, 1); 
                        if (!isDoubleBubble) {
                             loseLife();
                             createFloatingText(t.x, t.y, "DRANK SWILL!", "orange");
                             playSound('error'); 
                        } else {
                             createFloatingText(t.x, t.y, "SHIELDED!", "#fcd34d");
                        }
                        
                        checkGameOver(); triggerShake(10, 5); t.isHit = true; 
                    }
                }
            }
        }
        
        for (let i = particles.length - 1; i >= 0; i--) { particles[i].update(); particles[i].draw(ctx); if (particles[i].life <= 0) particles.splice(i, 1); }
        for (let i = clickEffects.length - 1; i >= 0; i--) { const c = clickEffects[i]; c.age++; ctx.fillStyle = `rgba(255, 255, 255, ${1 - c.age / 10})`; ctx.beginPath(); ctx.arc(c.x, c.y, 10 * (c.age / 10), 0, Math.PI * 2); ctx.fill(); if (c.age > 10) clickEffects.splice(i, 1); }
        
        ctx.restore(); 
        checkLevelUp();
        requestAnimationFrame(gameLoop);
    }
</script>
