<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Law on Tap</title>
    
    <link href="https://fonts.googleapis.com/css2?family=MedievalSharp&display=swap" rel="stylesheet">

    <style>
        /* RESET & LAYOUT */
        body { 
            margin: 0; 
            background: #000; /* Changed to pure black to match game letterboxing */
            overflow: hidden; 
            touch-action: none; 
            font-family: 'Courier New', Courier, monospace; 
        }
        canvas { 
            display: block; 
            margin: 0 auto; 
            background: #222; 
        }

        /* ORIENTATION WARNING (The "Bouncer") */
        #rotate-screen {
            display: none; 
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%;
            background: #000; 
            z-index: 999; 
            color: #f4d03f;
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            text-align: center;
        }
        
        /* Show warning only in Portrait */
        @media screen and (orientation: portrait) {
            #rotate-screen { display: flex; }
            canvas { display: none; }
        }
    </style>
</head>
<body>
    <div id="rotate-screen">
        <div style="font-size: 4rem;">🍺</div>
        <h2>BAR CLOSED</h2>
        <p>Turn your phone sideways to open.</p>
    </div>

    <canvas id="gameCanvas"></canvas>
    
    <script src="game.js"></script>
</body>
</html>
