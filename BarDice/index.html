                                                    <button
                                                        key={cnt}
                                                        onClick={() => { SoundFX.holdClick(true); setNumOpponentsToPlay(cnt); }}
                                                        className={`w-10 h-10 rounded-lg font-western text-sm transition-all border ${
                                                            numOpponentsToPlay === cnt
                                                                ? 'bg-amber-500 text-black border-yellow-200 shadow-[0_0_12px_rgba(234,179,8,0.5)] scale-105'
                                                                : 'bg-stone-900 text-stone-400 border-stone-700 hover:border-amber-700'
                                                        }`}
                                                    >
                                                        {cnt}
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                    </>
                                )}

                                {(gameState === 'GAME_OVER' || gameState === GAME_STATE_BAR_VICTORY) && (
                                    <div className="w-full max-w-xs bg-stone-950/90 border border-amber-800/60 rounded-xl p-3.5 font-mono-num text-xs text-stone-300 shadow-inner">
                                        <div className="text-amber-400 font-bold uppercase tracking-widest border-b border-stone-800 pb-1 mb-2 text-center">
                                            — Final House Ledger —
                                        </div>
                                        <div className="space-y-1">
                                            <div className="flex justify-between">
                                                <span className="text-stone-400">Rounds Survived:</span>
                                                <span className="text-white font-bold">{sessionStats.roundsSurvived}</span>
                                            </div>
                                            <div className="flex justify-between">
                                                <span className="text-stone-400">Pots Scooped:</span>
                                                <span className="text-amber-400 font-bold">{sessionStats.potsWon}</span>
                                            </div>
                                            <div className="flex justify-between">
                                                <span className="text-stone-400">Best Hand:</span>
                                                <span className="text-amber-300 font-bold">
                                                    {sessionStats.highestHandRank ? HAND_NAMES[sessionStats.highestHandRank].split('(')[0] : 'None'}
                                                </span>
                                            </div>
                                            <div className="flex justify-between pt-1 border-t border-stone-800 text-sm">
                                                <span className="text-stone-300 font-bold">Total Earnings:</span>
                                                <span className="text-emerald-400 font-bold">${sessionStats.totalEarnings}</span>
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {(gameState === 'GAME_OVER' || gameState === GAME_STATE_BAR_VICTORY) && !hasSubmittedScore && (
                                    <button
                                        onClick={() => {
                                            submitBarDiceScore(sessionStats, round);
                                            setHasSubmittedScore(true);
                                        }}
                                        className="btn-pulse px-7 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-full shadow-lg uppercase tracking-wider transition-colors text-xs"
                                    >
                                        Submit Score to Ledger
                                    </button>
                                )}

                                <button
                                    onClick={initializeGame}
                                    className="px-8 py-3 bg-gradient-to-b from-amber-400 to-amber-600 hover:from-amber-300 hover:to-amber-500 text-black font-western rounded-xl shadow-xl uppercase tracking-wider transition-transform active:scale-95 text-base border border-yellow-200"
                                >
                                    {gameState === 'START' ? 'Open the Taproom' : 'Pour Another Game'}
                                </button>
                            </div>
                        ) : (
                            /* PROPORTIONAL OPPONENT COASTER GRID */
                            <div className={`grid ${opponentGridClass} gap-2.5 h-full items-stretch auto-rows-fr`}>
                                {opponents.map((opp) => {
                                    const isMyTurn = gameState === 'ROLLING' && turnOrder[currentTurnIndex] === opp.id;
                                    const isHammer = turnOrder[0] === opp.id;
                                    const effectiveRole = activeDrinkBuff?.id === 'blood' ? 'Aggressive (Buff)' : (activeDrinkBuff?.id === 'egret' ? 'Patient (Buff)' : opp.type);

                                    let reactionClass = '';
                                    let statusBadge = null;

                                    if (gameState === 'ROLLING') {
                                        if (isMyTurn) {
                                            reactionClass = 'reaction-rolling';
                                            statusBadge = <span className="px-2 py-0.5 text-[9px] font-black uppercase bg-amber-500 text-black rounded-full animate-pulse">Shaking Cup...</span>;
                                        }
                                    } else if (gameState === 'ROUND_END' || gameState === 'EVALUATION') {
                                        if (lastRoundRankings.length > 0) {
                                            const rankIndex = lastRoundRankings.findIndex(r => r.id === opp.id);
                                            const isWinner = rankIndex === 0;
                                            const isLoser = rankIndex === lastRoundRankings.length - 1;
                                            const handStrength = opp.hand ? opp.hand.rank : 1;

                                            if (isWinner) {
                                                reactionClass = 'reaction-winner';
                                                statusBadge = <span className="px-2 py-0.5 text-[9px] font-black uppercase bg-yellow-400 text-black rounded-full shadow">🏆 Pot Winner</span>;
                                            } else if (handStrength >= 5) {
                                                reactionClass = 'reaction-angry';
                                                statusBadge = <span className="px-2 py-0.5 text-[9px] font-black uppercase bg-red-600 text-white rounded-full">😤 Salty</span>;
                                            } else if (isLoser) {
                                                reactionClass = 'reaction-loser';
                                                statusBadge = <span className="px-2 py-0.5 text-[9px] font-black uppercase bg-stone-700 text-stone-300 rounded-full">🍺 Buying Round</span>;
                                            } else {
                                                reactionClass = 'reaction-smug';
                                            }
                                        }
                                    }

                                    const AvatarComp = opp.Avatar;
                                    const displayQuote = opp.quote || PATRON_QUOTES[opp.name]?.idle;

                                    return (
                                        <div key={opp.id} className={`coaster-card p-2.5 md:p-3.5 rounded-2xl flex flex-col justify-between items-center transition-all duration-500 h-full ${isMyTurn ? 'active-turn' : 'inactive-turn'} ${reactionClass}`}>
                                            {/* Top Row: Hammer Badge & Status */}
                                            <div className="w-full flex justify-between items-center min-h-[1.25rem]">
                                                {isHammer ? (
                                                    <span className="bg-amber-500 text-black text-[9px] font-black px-2 py-0.5 rounded-full shadow uppercase tracking-wider">
                                                        🔨 Lead Hammer
                                                    </span>
                                                ) : <span />}
                                                {statusBadge}
                                            </div>

                                            {/* Center Identity: Large Rigged Avatar + Name + Cash */}
                                            <div className="flex flex-col items-center text-center gap-1.5 my-auto">
                                                <div className="w-14 h-14 sm:w-16 sm:h-16 md:w-20 md:h-20 rounded-full bg-stone-800 flex items-center justify-center shrink-0 overflow-hidden border-2 border-amber-600/80 shadow-lg">
                                                    <AvatarComp />
                                                </div>

                                                <div>
                                                    <div className="text-xs md:text-base font-bold text-amber-100 leading-tight">{opp.name}</div>
                                                    <div className="text-[9px] md:text-[10px] text-amber-500/80 uppercase tracking-wider font-semibold">{effectiveRole}</div>
                                                </div>

                                                <div className="inline-flex items-center text-xs md:text-sm text-emerald-400 font-mono-num font-bold bg-black/50 px-2.5 py-0.5 rounded-full border border-emerald-800/60">
                                                    <Icon name="DollarSign" size={12} className="text-emerald-400"/> {opp.money}
                                                </div>
                                            </div>

                                            {/* Dedicated Speech / Chatter Bar */}
                                            <div className="w-full my-1.5">
                                                <div className={`${opp.quote ? 'speech-pill font-bold' : 'bg-black/35 text-stone-400 border border-stone-800/80 italic'} px-2.5 py-1 rounded-lg text-[10px] md:text-xs text-center truncate w-full`}>
                                                    "{displayQuote}"
                                                </div>
                                            </div>

                                            {/* Bottom Coaster Dice Tray & Hand Evaluation */}
                                            <div className="w-full bg-black/40 border border-amber-950/60 rounded-xl p-2 flex flex-col items-center gap-1.5">
                                                <div className="flex gap-1 md:gap-1.5 justify-center">
                                                    {opp.dice.map((d, i) => (
                                                        <Die key={i} value={d} size="small" isRolling={isMyTurn} />
                                                    ))}
                                                </div>
                                                <div className="text-[10px] md:text-xs font-bold text-amber-400 uppercase tracking-wider truncate w-full text-center">
                                                    {isMyTurn ? 'Shaking Cup...' : (opp.hand ? HAND_NAMES[opp.hand.rank] : 'Waiting for turn...')}
                                                </div>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        )}
                    </div>

                    {/* 4. PLAYER RECESSED FELT DICE TRAY (BALANCED BOTTOM SECTION) */}
                    {gameState !== 'START' && gameState !== 'GAME_OVER' && gameState !== GAME_STATE_BAR_VICTORY && (
                        <div className={`w-full max-w-6xl glass-panel p-3 md:p-4 rounded-2xl border-t-4 transition-all duration-500 z-20 shrink-0 ${isPlayerTurn ? 'border-yellow-500 shadow-[0_0_25px_rgba(234,179,8,0.25)]' : 'border-stone-800 opacity-90'}`}>

                                <div className="flex items-center gap-3 flex-wrap">

                                            <span className="text-[10px] font-sans bg-amber-500/20 border border-amber-400 text-amber-300 px-2 py-0.5 rounded-full font-bold">

                                            </span>
                                        )}

                                                {isPlayerTurn && rollsLeft > 0 ? (

                                                        onClick={handleDoubleTap}

                                                        <Icon name="Bell" size={14} /> DOUBLE TAP (+$10 POT)
                                                    </button>
                                                )}
                                            </>

                                        {gameState === 'ROUND_END' && (
                                            <button
                                                onClick={() => { startRound(); }}
                                                className="btn-pulse w-full px-6 py-3.5 bg-gradient-to-b from-emerald-500 to-emerald-700 hover:from-emerald-400 hover:to-emerald-600 text-white font-bold rounded-xl shadow-xl flex items-center justify-center gap-2 border border-emerald-300 tracking-wide text-sm"
                                            >
                                                NEXT ROUND <Icon name="TrendingUp" size={18} />
                                            </button>
                                        )}
                                    </div>

                                    <div className="text-center text-[10px] md:text-[11px] text-stone-400 leading-tight">
                                        {isPlayerTurn
                                            ? (isPlayerLead
                                                ? "Tap dice to HOLD, or click CALL IN to cap the table's shakes."
                                                : "Tap dice to HOLD between shakes, or ring DOUBLE TAP to press the pot.")
                                            : "Watch your patrons' shakes and reactions."}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
