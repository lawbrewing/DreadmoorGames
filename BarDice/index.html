<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Law Brewing Bar Dice</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rye&family=Roboto:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap');

        :root {
            --gold: #eab308;
            --gold-glow: rgba(234, 179, 8, 0.55);
            --brass: #b45309;
            --felt: #0f291e;
            --mahogany-dark: #160a06;
            --mahogany-mid: #2b130b;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: #0d0604;
            color: white;
            margin: 0;
            overflow: hidden;
            touch-action: manipulation;
            user-select: none;
        }

        #root {
            width: 100%;
            height: 100dvh;
            display: flex;
            justify-content: center;
            overflow: hidden;
        }

        .loading-text {
            margin-top: 40px;
            color: #eab308;
            font-family: 'Rye', serif;
            text-align: center;
            letter-spacing: 0.1em;
        }

        .font-western {
            font-family: 'Rye', serif;
        }

        .font-mono-num {
            font-family: 'JetBrains Mono', monospace;
        }

        /* -------------------------------------------
           MAHOGANY BARTOP & AMBIENT LIGHTING
        ------------------------------------------- */
        .wood-texture {
            background-color: var(--mahogany-dark);
            background-image:
                radial-gradient(ellipse at 50% 35%, rgba(245, 158, 11, 0.15) 0%, rgba(0, 0, 0, 0.72) 75%),
                repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.015) 0px, rgba(255, 255, 255, 0.015) 2px, transparent 2px, transparent 9px),
                repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.25) 0px, rgba(43, 19, 11, 0.35) 12px, rgba(22, 10, 6, 0.4) 24px),
                linear-gradient(180deg, #2b120a 0%, #1a0b06 50%, #0d0503 100%);
            width: 100%;
            height: 100dvh;
            position: relative;
            overflow: hidden;
        }

        .wood-texture::before {
            content: "";
            position: absolute;
            top: 14%;
            left: 6%;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 5px solid rgba(0, 0, 0, 0.25);
            box-shadow: inset 0 0 12px rgba(0,0,0,0.2), 18px 25px 0 -4px rgba(0, 0, 0, 0.15);
            pointer-events: none;
            z-index: 1;
        }

        .wood-texture::after {
            content: "";
            position: absolute;
            bottom: 12%;
            right: 5%;
            width: 105px;
            height: 105px;
            border-radius: 50%;
            border: 4px solid rgba(0, 0, 0, 0.22);
            pointer-events: none;
            z-index: 1;
        }

        /* -------------------------------------------
           NEON SIGN & BRASS PLAQUE PANELS
        ------------------------------------------- */
        @keyframes neon-flicker {
            0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% {
                text-shadow:
                    0 0 4px #fef08a,
                    0 0 12px #eab308,
                    0 0 22px rgba(234, 179, 8, 0.65),
                    0 2px 4px rgba(0, 0, 0, 0.9);
            }
            20%, 24%, 55% {
                text-shadow: 0 2px 4px rgba(0, 0, 0, 0.9);
            }
        }

        .neon-title {
            color: #fef08a;
            animation: neon-flicker 6s infinite;
        }

        .glass-panel {
            background: linear-gradient(145deg, rgba(32, 22, 17, 0.95) 0%, rgba(18, 12, 9, 0.98) 100%);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(217, 119, 6, 0.35);
            box-shadow:
                0 8px 20px -5px rgba(0, 0, 0, 0.8),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }

        .coaster-card {
            background: radial-gradient(circle at 50% 25%, #2f201a 0%, #19110d 75%, #120c09 100%);
            border: 2px solid #4a3020;
            box-shadow:
                0 8px 18px rgba(0, 0, 0, 0.75),
                inset 0 1px 1px rgba(255, 255, 255, 0.08);
            position: relative;
        }

        .chalkboard-banner {
            background: radial-gradient(circle at center, #1e2421 0%, #111513 100%);
            border: 2px solid #78350f;
            box-shadow:
                0 6px 14px rgba(0, 0, 0, 0.7),
                inset 0 0 15px rgba(0, 0, 0, 0.85);
            position: relative;
        }

        /* Speech Bubble Inside Card */
        @keyframes bubble-pop {
            0% { transform: scale(0.85); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .speech-pill {
            animation: bubble-pop 0.22s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            background: linear-gradient(180deg, #fef9c3 0%, #fde047 100%);
            color: #1c1917;
            border: 1.5px solid #b45309;
            box-shadow: 0 3px 8px rgba(0,0,0,0.6);
        }

        /* -------------------------------------------
           RECESSED FELT DICE TRAY
        ------------------------------------------- */
        .felt-dice-pit {
            background: radial-gradient(ellipse at center, #184533 0%, #0b241a 70%, #05130d 100%);
            border: 3px solid #78350f;
            box-shadow:
                inset 0 8px 20px rgba(0, 0, 0, 0.9),
                inset 0 0 35px rgba(0, 0, 0, 0.65),
                0 2px 0 rgba(251, 191, 36, 0.2);
            position: relative;
        }

        .brass-rivet {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #fde047, #b45309 70%, #451a03 100%);
            box-shadow: 0 1px 2px rgba(0,0,0,0.8);
            position: absolute;
        }

        /* -------------------------------------------
           3D SCULPTED BAR DICE
        ------------------------------------------- */
        .dice-face {
            transition: all 0.22s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            user-select: none;
            position: relative;
        }

        .dice-face:active {
            transform: scale(0.92);
        }

        .die-ivory {
            background: linear-gradient(145deg, #fffbeb 0%, #f3e8d2 55%, #d6c3a5 100%);
            border: 1px solid #a89070;
            box-shadow:
                0 5px 10px rgba(0, 0, 0, 0.75),
                0 3px 0 #8c7355,
                inset 0 2px 3px rgba(255, 255, 255, 0.9),
                inset 0 -2px 4px rgba(138, 112, 80, 0.45);
        }

        .die-ivory:hover {
            filter: brightness(1.05);
        }

        .die-wild-ace {
            background: linear-gradient(145deg, #fef9c3 0%, #fde047 45%, #ca8a04 100%);
            border: 1px solid #fef08a;
            box-shadow:
                0 5px 12px rgba(234, 179, 8, 0.4),
                0 3px 0 #854d0e,
                inset 0 2px 4px rgba(255, 255, 255, 0.95),
                inset 0 -2px 5px rgba(133, 77, 14, 0.6);
        }

        .die-held {
            transform: translateY(-8px) scale(1.05) !important;
            border: 2px solid #facc15 !important;
            box-shadow:
                0 12px 18px -4px rgba(0, 0, 0, 0.85),
                0 0 16px rgba(234, 179, 8, 0.75),
                0 3px 0 #b45309,
                inset 0 2px 3px rgba(255, 255, 255, 0.9) !important;
        }

        .pip-dot {
            background: radial-gradient(circle at 35% 35%, #334155 0%, #0f172a 70%, #020617 100%);
            box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.9), 0 1px 0 rgba(255, 255, 255, 0.6);
        }

        .pip-six-red {
            background: radial-gradient(circle at 35% 35%, #ef4444 0%, #991b1b 75%, #450a0a 100%);
            box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.8), 0 1px 0 rgba(255, 255, 255, 0.6);
        }

        @keyframes pulse-yellow {
            0%, 100% {
                box-shadow: 0 0 0 0px rgba(234, 179, 8, 0.7), 0 4px 12px rgba(0, 0, 0, 0.6);
            }
            50% {
                box-shadow: 0 0 0 8px rgba(234, 179, 8, 0), 0 4px 16px rgba(234, 179, 8, 0.5);
            }
        }

        .btn-pulse {
            animation: pulse-yellow 2s infinite;
        }

        .active-turn {
            border-color: #eab308 !important;
            box-shadow:
                0 0 22px rgba(234, 179, 8, 0.35),
                inset 0 0 15px rgba(234, 179, 8, 0.12) !important;
        }

        .inactive-turn {
            opacity: 0.9;
        }

        .cheat-sheet-container:hover .cheat-sheet {
            display: block;
        }

        .cheat-sheet {
            z-index: 9999;
        }

        @keyframes dice-roll {
            0% { transform: translate3d(0, 0, 0) rotate(0deg) scale(1); }
            20% { transform: translate3d(-5px, -10px, 0) rotate(-35deg) scale(1.1); }
            45% { transform: translate3d(7px, 5px, 0) rotate(40deg) scale(0.92); }
            70% { transform: translate3d(-4px, -5px, 0) rotate(-18deg) scale(1.05); }
            100% { transform: translate3d(0, 0, 0) rotate(0deg) scale(1); }
        }

        .rolling-animation {
            animation: dice-roll 0.42s cubic-bezier(0.36, 0.07, 0.19, 0.97) infinite;
        }

        /* -------------------------------------------
           AVATAR AMBIENT ANIMATIONS
        ------------------------------------------- */
        @keyframes blink {
            0%, 90%, 100% { transform: scaleY(1); }
            95% { transform: scaleY(0.1); }
        }

        @keyframes glasses-glint {
            0%, 80%, 100% { opacity: 0; transform: translateX(-10px); }
            85% { opacity: 0.85; }
            90% { opacity: 0; transform: translateX(25px); }
        }

        @keyframes egret-peck {
            0%, 100% { transform: rotate(0deg); }
            40% { transform: rotate(-8deg); }
            50% { transform: rotate(12deg); }
            60% { transform: rotate(0deg); }
        }

        @keyframes cigar-flicker {
            0%, 100% { fill: #c53030; filter: drop-shadow(0 0 1px #e53e3e); }
            50% { fill: #ff7b00; filter: drop-shadow(0 0 5px #f56565); }
        }

        @keyframes cigar-smoke {
            0% { opacity: 0; transform: translate(0, 0) scale(0.5); }
            40% { opacity: 0.55; }
            100% { opacity: 0; transform: translate(-6px, -18px) scale(1.6); }
        }

        .anim-blink { transform-origin: center; transform-box: fill-box; animation: blink 4s infinite; }
        .anim-glint { animation: glasses-glint 5s infinite; }
        .anim-peck { transform-origin: 50% 80%; animation: egret-peck 3s infinite ease-in-out; }
        .anim-cigar { animation: cigar-flicker 1.5s infinite; }
        .anim-smoke-1 { animation: cigar-smoke 2.6s infinite ease-out; }
        .anim-smoke-2 { animation: cigar-smoke 2.6s infinite 1.3s ease-out; }

        /* -------------------------------------------
           CONTAINER EMOTIONAL REACTIONS
        ------------------------------------------- */
        @keyframes react-bounce {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-6px) scale(1.03); background-color: #422006; }
        }

        .reaction-rolling { border-color: #eab308 !important; }

        .reaction-winner {
            animation: react-bounce 0.75s infinite cubic-bezier(0.28, 0.84, 0.42, 1);
            border-color: #eab308 !important;
            box-shadow: 0 0 24px rgba(234, 179, 8, 0.85) !important;
            z-index: 20;
        }

        .reaction-loser {
            filter: grayscale(0.8) brightness(0.65);
            border-color: #1e293b !important;
        }

        .reaction-angry {
            border-color: #ef4444 !important;
            background: radial-gradient(circle at 50% 30%, #450a0a 0%, #1f0505 100%) !important;
            box-shadow: 0 0 18px rgba(239, 68, 68, 0.4) !important;
        }

        .reaction-smug { border-color: #3b82f6 !important; }

        /* -------------------------------------------
           INTERNAL FACIAL RIGGING
        ------------------------------------------- */
        .avatar-part {
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease;
            transform-box: fill-box;
            transform-origin: center;
        }

        @keyframes eyes-dart {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }

        @keyframes sweat-drip {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(3px); }
        }

        .reaction-rolling .avatar-eyes { animation: eyes-dart 0.3s infinite; }
        .reaction-rolling .avatar-mouth { transform: scale(0.4, 0.4); }
        .reaction-rolling .avatar-sweat { opacity: 1 !important; animation: sweat-drip 0.15s infinite alternate; }
        .reaction-rolling .avatar-eyebrow-l { transform: translateY(-2px) rotate(-5deg); }
        .reaction-rolling .avatar-eyebrow-r { transform: translateY(-2px) rotate(5deg); }

        .reaction-winner .avatar-mouth { transform: scale(1.6, 2) translateY(2px); }
        .reaction-winner .avatar-eyebrow-l { transform: translateY(-8px) rotate(-25deg); }
        .reaction-winner .avatar-eyebrow-r { transform: translateY(-8px) rotate(25deg); }
        .reaction-winner .avatar-eyes { transform: scaleY(0.2); }

        @keyframes face-rage {
            0%, 100% { transform: translate(0,0); }
            25% { transform: translate(-2px, 1px); }
            75% { transform: translate(2px, -1px); }
        }

        .reaction-angry .avatar-mouth { transform: scale(1.5, -1) translateY(-6px); animation: face-rage 0.1s infinite; }
        .reaction-angry .avatar-eyebrow-l { transform: translateY(6px) rotate(40deg); stroke: #ef4444; animation: face-rage 0.1s infinite; }
        .reaction-angry .avatar-eyebrow-r { transform: translateY(6px) rotate(-40deg); stroke: #ef4444; animation: face-rage 0.1s infinite; }
        .reaction-angry .avatar-eyes { transform: scale(1.3) translateY(2px); fill: #ef4444; animation: face-rage 0.1s infinite; }

        .reaction-smug .avatar-mouth { transform: scale(0.8) translateX(4px) rotate(-15deg); }
        .reaction-smug .avatar-eyebrow-l { transform: translateY(-6px) rotate(-15deg); }
        .reaction-smug .avatar-eyebrow-r { transform: translateY(2px) rotate(10deg); }
        .reaction-smug .avatar-eyes { transform: scaleY(0.8) translateX(2px); }

        .reaction-loser .avatar-mouth { transform: scale(1.4, -1.6) translateY(-8px); }
        .reaction-loser .avatar-eyebrow-l { transform: translateY(-4px) rotate(-30deg); }
        .reaction-loser .avatar-eyebrow-r { transform: translateY(-4px) rotate(30deg); }
        .reaction-loser .avatar-eyes { transform: scaleY(0.4) translateY(4px); }
        .reaction-loser .avatar-sweat { opacity: 1 !important; transform: translateY(12px); transition: transform 2s ease-in; }

        .reaction-rolling .avatar-beak-top { transform: rotate(-5deg); }
        .reaction-rolling .avatar-beak-bottom { transform: rotate(5deg); }
        .reaction-winner .avatar-beak-top { transform: rotate(-35deg) translateY(-2px); }
        .reaction-winner .avatar-beak-bottom { transform: rotate(35deg) translateY(2px); }
        .reaction-angry .avatar-beak-top { transform: rotate(-10deg); animation: face-rage 0.1s infinite; }
        .reaction-angry .avatar-beak-bottom { transform: rotate(-5deg); animation: face-rage 0.1s infinite; }
        .reaction-smug .avatar-beak-top { transform: translateY(-2px); }
        .reaction-loser .avatar-beak-top { transform: translateY(6px) rotate(15deg); }
        .reaction-loser .avatar-beak-bottom { transform: translateY(6px); }

        .die-physics {
            transition: transform 0.45s cubic-bezier(0.25, 1.25, 0.5, 1);
            transform-style: preserve-3d;
        }
    </style>

    <script>
        window.onerror = function (message, source, lineno, colno, error) {
            console.error("Critical Runtime Error:", message, "Line:", lineno);
            document.body.innerHTML = "<div style='color:white;padding:20px;text-align:center'><h2>Game Error Detected</h2><p>Check console (F12) for details.</p><small>" + message + "</small></div>";
        };
    </script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"><div class="loading-text">Pouring Pints & Setting the Dice...</div></div>
    <audio id="bgm" src="Inheriting_the_Sea.mp3" loop preload="auto"></audio>
    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        /* -------------------------------------------
           PROCEDURAL WEB AUDIO SYNTHESIZER
        ------------------------------------------- */
        const SoundFX = {
            ctx: null,
            muted: false,
            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) this.ctx = new AudioCtx();
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            },
            shakeAndRoll() {
                if (this.muted) return;
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;

                for (let i = 0; i < 5; i++) {
                    const t = now + i * 0.065 + (Math.random() * 0.015);
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(320 + Math.random() * 240, t);
                    osc.frequency.exponentialRampToValueAtTime(75, t + 0.045);

                    gain.gain.setValueAtTime(0.16, t);
                    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.045);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(t);
                    osc.stop(t + 0.05);
                }

                const landTime = now + 0.36;
                const thudOsc = this.ctx.createOscillator();
                const thudGain = this.ctx.createGain();
                thudOsc.type = 'sine';
                thudOsc.frequency.setValueAtTime(115, landTime);
                thudOsc.frequency.exponentialRampToValueAtTime(32, landTime + 0.14);

                thudGain.gain.setValueAtTime(0.32, landTime);
                thudGain.gain.exponentialRampToValueAtTime(0.001, landTime + 0.15);

                thudOsc.connect(thudGain);
                thudGain.connect(this.ctx.destination);
                thudOsc.start(landTime);
                thudOsc.stop(landTime + 0.16);
            },
            holdClick(locking = true) {
                if (this.muted) return;
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(locking ? 520 : 720, now);
                osc.frequency.exponentialRampToValueAtTime(locking ? 860 : 420, now + 0.055);

                gain.gain.setValueAtTime(0.14, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.065);
            },
            callTheBar() {
                if (this.muted) return;
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                [0, 0.14].forEach(offset => {
                    const t = now + offset;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(160, t);
                    osc.frequency.exponentialRampToValueAtTime(42, t + 0.09);

                    gain.gain.setValueAtTime(0.4, t);
                    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.095);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(t);
                    osc.stop(t + 0.1);
                });
            },
            doubleTapBell() {
                if (this.muted) return;
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                [880, 1320, 1760].forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = idx === 0 ? 'triangle' : 'sine';
                    osc.frequency.setValueAtTime(freq, now);

                    gain.gain.setValueAtTime(0.18 / (idx + 1), now);
                    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.65);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.66);
                });
            },
            potWin() {
                if (this.muted) return;
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                [987.77, 1318.51, 1567.98, 1975.53].forEach((freq, idx) => {
                    const t = now + idx * 0.07;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, t);

                    gain.gain.setValueAtTime(0.16, t);
                    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.28);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(t);
                    osc.stop(t + 0.29);
                });
            },
            buyRound() {
                if (this.muted) return;
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                [1850, 2420].forEach((freq, i) => {
                    const t = now + i * 0.05;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, t);

                    gain.gain.setValueAtTime(0.12, t);
                    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.22);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(t);
                    osc.stop(t + 0.23);
                });
            }
        };

        const Icons = {
            Star: () => (
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" stroke="#78350f" strokeWidth="1">
                    <path d="M12 1.5L14.85 8.35L22.2 9.1L16.7 14.05L18.3 21.3L12 17.55L5.7 21.3L7.3 14.05L1.8 9.1L9.15 8.35L12 1.5Z"/>
                </svg>
            ),
            Beer: () => (
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <path d="M7 7h10v11a3 3 0 0 1-3 3H9a3 3 0 0 1-3-3V7Z" fill="#eab308" stroke="#eab308" fillOpacity="0.5"/>
                    <path d="M6 7a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v0H6v0Z" fill="white" stroke="white"/>
                    <path d="M17 8h1a4 4 0 0 1 0 8h-1" stroke="currentColor"/>
                    <line x1="7" y1="7" x2="17" y2="7" stroke="currentColor"/>

        const evaluateHand = (dice) => {
            if (!dice || dice[0] === 0) return null;
            try {
                const counts = {};
                let wilds = 0;
                dice.forEach(d => {
                    if (d === 1) wilds++;
                    else counts[d] = (counts[d] || 0) + 1;
                });

                const uniqueValues = Object.keys(counts).map(Number).sort((a,b) => b-a);
                const maxCount = uniqueValues.length > 0 ? Math.max(...Object.values(counts)) : 0;

                if (maxCount + wilds >= 5) return { rank: HAND_RANKS.FIVE_OF_A_KIND, value: uniqueValues[0] || 6 };
                if (maxCount + wilds >= 4) return { rank: HAND_RANKS.FOUR_OF_A_KIND, value: uniqueValues[0] };

                for (let val of uniqueValues) {
                    let w = wilds;
                    let c = counts[val];
                    if (c + w >= 3) {
                        let w_remain = w - (3 - c);
                        if (w_remain < 0) w_remain = 0;
                        for (let val2 of uniqueValues) {
                            if (val2 === val) continue;
                            if (counts[val2] + w_remain >= 2) return { rank: HAND_RANKS.FULL_HOUSE, value: val * 10 + val2 };
                        }
                    }
                }

                const needed = [2, 3, 4, 5, 6];
                let missing = 0;
                needed.forEach(n => { if (!dice.includes(n)) missing++; });
                if (missing <= wilds) return { rank: HAND_RANKS.STRAIGHT, value: 6 };

                if (maxCount + wilds >= 3) return { rank: HAND_RANKS.THREE_OF_A_KIND, value: uniqueValues[0] };

                let pairs = 0;
                let w_temp = wilds;
                for (let val of uniqueValues) {
                    if (counts[val] >= 2) { pairs++; }
                    else if (counts[val] === 1 && w_temp > 0) { pairs++; w_temp--; }
                }
                if (pairs >= 2) return { rank: HAND_RANKS.TWO_PAIR, value: uniqueValues[0] };
                if (maxCount + wilds >= 2) return { rank: HAND_RANKS.ONE_PAIR, value: uniqueValues[0] };

                return { rank: HAND_RANKS.HIGH_CARD, value: Math.max(...dice) };
            } catch (e) {
                return { rank: 1, value: 1 };
            }

            const [gameState, setGameState] = useState('START');
            const [numOpponentsToPlay, setNumOpponentsToPlay] = useState(3);
            const [funds, setFunds] = useState(HOUSE_START_MONEY);
            const [pot, setPot] = useState(0);
            const [round, setRound] = useState(1);
            const [message, setMessage] = useState("Welcome to Law Brewing!");
            const [hasSubmittedScore, setHasSubmittedScore] = useState(false);
            const [isMuted, setIsMuted] = useState(false);

            const [activeDrinkBuff, setActiveDrinkBuff] = useState(null);
            const [nextDrinkBuff, setNextDrinkBuff] = useState(null);
            const [roundMaxRolls, setRoundMaxRolls] = useState(3);
            const [isCapLocked, setIsCapLocked] = useState(false);
            const [doubleTapUsed, setDoubleTapUsed] = useState(false);

            const [sessionStats, setSessionStats] = useState({
                roundsSurvived: 0,
                highestHandRank: 0,
                potsWon: 0,
                totalEarnings: 0
            });

            const [playerDice, setPlayerDice] = useState([0, 0, 0, 0, 0]);
            const [heldDice, setHeldDice] = useState([false, false, false, false, false]);
            const [dicePhysics, setDicePhysics] = useState(Array(5).fill({x:0, y:0, rot:0}));
            const [rollsLeft, setRollsLeft] = useState(3);
            const [playerHand, setPlayerHand] = useState(null);
            const [isRollingDice, setIsRollingDice] = useState(false);

            const [opponents, setOpponents] = useState([]);
            const [retiredPatronTypes, setRetiredPatronTypes] = useState([]);

            const [turnOrder, setTurnOrder] = useState([]);
            const [currentTurnIndex, setCurrentTurnIndex] = useState(0);
            const [lastRoundRankings, setLastRoundRankings] = useState([]);

            const playerDiceRef = useRef(playerDice);
            const opponentsRef = useRef(opponents);
            const fundsRef = useRef(funds);
            const potRef = useRef(pot);
            const roundMaxRollsRef = useRef(roundMaxRolls);
            const activeDrinkBuffRef = useRef(activeDrinkBuff);
            const nextDrinkBuffRef = useRef(nextDrinkBuff);

            useEffect(() => { playerDiceRef.current = playerDice; }, [playerDice]);
            useEffect(() => { opponentsRef.current = opponents; }, [opponents]);
            useEffect(() => { fundsRef.current = funds; }, [funds]);
            useEffect(() => { potRef.current = pot; }, [pot]);
            useEffect(() => { roundMaxRollsRef.current = roundMaxRolls; }, [roundMaxRolls]);
            useEffect(() => { activeDrinkBuffRef.current = activeDrinkBuff; }, [activeDrinkBuff]);
            useEffect(() => { nextDrinkBuffRef.current = nextDrinkBuff; }, [nextDrinkBuff]);

            const toggleAudio = () => {
                const bgm = document.getElementById('bgm');
                const nextMute = !isMuted;
                setIsMuted(nextMute);
                SoundFX.muted = nextMute;
                if (bgm) bgm.muted = nextMute;
            };

            const submitBarDiceScore = async (finalStats, finalRound) => {
                let name = prompt("BAR CLOSED! Enter your Patron ID (Max 15 chars):", "ANONYMOUS");
                if (!name) name = "ANONYMOUS";
                const cleanName = name.trim().toUpperCase().substring(0, 15).replace(/[^A-Z0-9 ]/g, "");

                const payload = {
                    player_name: cleanName,
                    score: finalStats.totalEarnings,
                    level_reached: finalRound,
                    stats: finalStats
                };

                try {
                    await fetch('https://lawbrewing.tail03b2f1.ts.net/api/scores/bar_dice', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    console.log("Bar Dice telemetry saved to Dreadmoor API.");
                } catch (err) {
                    console.error("Telemetry failed to send:", err);
                }
            };

            useEffect(() => {
                if (gameState === 'ROLLING') {
                    const activeId = turnOrder[currentTurnIndex];
                    if (activeId !== undefined && activeId !== 'player') {
                        SoundFX.shakeAndRoll();
                        const aiDelay = setTimeout(() => {
                            playAITurn(activeId);
                        }, 1150);
                        return () => clearTimeout(aiDelay);
                    }
                }
            }, [currentTurnIndex, gameState, turnOrder]);

            const playAITurn = (aiId) => {
                const isLeadRoller = currentTurnIndex === 0;
                const maxAllowedRolls = roundMaxRollsRef.current;
                const currentBuff = activeDrinkBuffRef.current;
                let leadCalledEarly = false;
                let newCap = maxAllowedRolls;
                let bonusAlert = "";

                const newOpps = opponentsRef.current.map(opp => {
                    if (opp.id === aiId) {
                        let currentDice = [1,1,1,1,1].map(() => Math.ceil(Math.random() * 6));
                        let rollsUsed = 1;

                        for (let r = 1; r < maxAllowedRolls; r++) {
                            const evalNow = evaluateHand(currentDice);
                            if (isLeadRoller) {
                                if (r === 1 && evalNow.rank >= HAND_RANKS.STRAIGHT) {
                                    leadCalledEarly = true;
                                    newCap = 1;
                                    break;
                                }
                                if (r === 2 && evalNow.rank >= HAND_RANKS.THREE_OF_A_KIND) {
                                    leadCalledEarly = true;
                                    newCap = 2;
                                    break;
                                }
                            }
                            if (evalNow.rank === HAND_RANKS.FIVE_OF_A_KIND) break;

                            const keeps = getAIKeeps(currentDice, opp, currentBuff);
                            if (keeps.length === 5) break;
                            currentDice = currentDice.map((d, i) => keeps.includes(i) ? d : Math.ceil(Math.random() * 6));
                            rollsUsed++;
                        }

                        const finalHand = evaluateHand(currentDice);
                        let updatedMoney = opp.money;

                        if (currentBuff?.id === 'sublime' && has311Combo(currentDice)) {
                            updatedMoney += 10;
                            bonusAlert = ` 🎶 ${opp.name} hit 3-1-1 (+$10)!`;
                        }
                        if (currentBuff?.id === 'egret' && finalHand.rank === HAND_RANKS.STRAIGHT) {
                            updatedMoney += 15;
                            bonusAlert += ` 🦢 ${opp.name} hit Lagoon Zen (+$15)!`;
                        }

                        const quotePool = PATRON_QUOTES[opp.name];
                        const chosenQuote = leadCalledEarly
                            ? quotePool?.call
                            : (finalHand.rank >= HAND_RANKS.FULL_HOUSE ? "Top that hand, barkeep!" : null);

                        return {
                            ...opp,
                            money: updatedMoney,
                            dice: currentDice,
                            hand: finalHand,
                            rollsUsed,
                            status: 'Done',
                            quote: chosenQuote
                        };
                    }
                    return opp;
                });

                if (leadCalledEarly) {
                    SoundFX.callTheBar();
                    setRoundMaxRolls(newCap);
                    roundMaxRollsRef.current = newCap;
                    setIsCapLocked(true);
                }

                setOpponents(newOpps);
                opponentsRef.current = newOpps;
                advanceTurn(leadCalledEarly ? newCap : null, bonusAlert);
            };

            const advanceTurn = (justCalledCap = null, extraNote = "") => {
                const nextIndex = currentTurnIndex + 1;
                const capToUse = justCalledCap || roundMaxRollsRef.current;

                if (nextIndex >= turnOrder.length) {
                    finishRound(extraNote);
                } else {
                    setCurrentTurnIndex(nextIndex);
                    const nextId = turnOrder[nextIndex];
                    const callPrefix = justCalledCap ? `🔨 BAR CALLED IN ${justCalledCap}! ` : "";

                    if (nextId === 'player') {
                        setPlayerDice([0,0,0,0,0]);
                        setHeldDice([false,false,false,false,false]);
                        setDicePhysics(Array(5).fill({x:0, y:0, rot:0}));
                        setRollsLeft(capToUse);
                        setMessage(`${callPrefix}Your turn! You have up to ${capToUse} ${capToUse === 1 ? 'shake' : 'shakes'}.${extraNote}`);
                    } else {
                        const nextOpp = opponentsRef.current.find(o => o.id === nextId);
                        const oppName = nextOpp?.name || "Opponent";
                        const updated = opponentsRef.current.map(o =>
                            o.id === nextId ? { ...o, quote: PATRON_QUOTES[o.name]?.rolling } : o
                        );
                        setOpponents(updated);
                        opponentsRef.current = updated;
                        setMessage(`${callPrefix}${oppName} is shaking the dice cup...${extraNote}`);
                    }
                }
            };

            const initializeGame = () => {
                SoundFX.init();
                setHasSubmittedScore(false);
                const bgm = document.getElementById('bgm');
                if (bgm) {
                    bgm.volume = 0.4;
                    bgm.muted = isMuted;
                    bgm.play().catch(e => console.log("Audio play blocked", e));
                }
                setFunds(HOUSE_START_MONEY);
                fundsRef.current = HOUSE_START_MONEY;
                setRound(1);
                setLastRoundRankings([]);
                setRetiredPatronTypes([]);
                setActiveDrinkBuff(null);
                setNextDrinkBuff(null);
                activeDrinkBuffRef.current = null;
                nextDrinkBuffRef.current = null;

                setSessionStats({
                    roundsSurvived: 0,
                    highestHandRank: 0,
                    potsWon: 0,
                    totalEarnings: 0
                });

                const allPatronTypes = [...BASE_PATRON_TYPES];
                const shuffled = allPatronTypes.sort(() => 0.5 - Math.random());
                const initialTypes = shuffled.slice(0, numOpponentsToPlay);

                const newOpponents = initialTypes.map((pType, i) => ({
                    ...pType,
                    id: i,
                    dice: [0,0,0,0,0],
                    hand: null,
                    money: PATRON_START_MONEY,
                    status: 'Waiting',
                    typeId: pType.name,
                    quote: null,
                    Avatar: getAvatarComponent(pType.name)
                }));

                setOpponents(newOpponents);
                opponentsRef.current = newOpponents;

                const order = [...newOpponents.map(o => o.id), 'player'];
                setupRound(order, newOpponents, HOUSE_START_MONEY, null);
            };

            const processEliminations = (currentOpponents, requiredAnte) => {
                 const survivingOpponents = [];
                 const newRetired = [];
                 let eliminationMsg = "";

                 currentOpponents.forEach(opp => {
                     if (opp.money < requiredAnte) {
                         newRetired.push(opp.typeId);
                         eliminationMsg += `🚨 ${opp.name} tabbed out! `;
                     } else {
                         survivingOpponents.push(opp);
                     }
                 });

                 let finalOpponents = [...survivingOpponents];
                 const allRetired = [...retiredPatronTypes, ...newRetired];

                 if (newRetired.length > 0) {
                     const seatsNeeded = numOpponentsToPlay - survivingOpponents.length;
                     const sittingTypes = finalOpponents.map(o => o.typeId);

                     for (let i = 0; i < seatsNeeded; i++) {
                         const availableTypes = BASE_PATRON_TYPES.filter(p => !allRetired.includes(p.name) && !sittingTypes.includes(p.name));

                         if (availableTypes.length > 0) {
                             const replacementType = availableTypes[0];
                             sittingTypes.push(replacementType.name);

                             finalOpponents.push({
                                 ...replacementType,
                                 id: Math.max(...currentOpponents.map(o => o.id), 0) + 1 + i,
                                 dice: [0,0,0,0,0],
                                 hand: null,
                                 money: PATRON_START_MONEY,
                                 status: 'Waiting',
                                 typeId: replacementType.name,
                                 quote: "Fresh tab! Deal me in.",
                                 Avatar: getAvatarComponent(replacementType.name)
                             });
                             eliminationMsg += `${replacementType.name} pulled up a stool! `;
                         } else {
                             eliminationMsg += `No more regulars left in the bar! `;
                         }
                     }
                 }

                 return { opponents: finalOpponents, newRetiredList: allRetired, msg: eliminationMsg };
            };

            const startRound = () => {
                const incomingDrink = nextDrinkBuffRef.current;
                const nextAnte = incomingDrink?.id === 'cabana' ? 15 : CONTRIBUTION;

                const { opponents: nextOpponents, newRetiredList, msg } = processEliminations(opponentsRef.current, nextAnte);

                if (newRetiredList.length > retiredPatronTypes.length) {
                     setRetiredPatronTypes(newRetiredList);
                }

                if (nextOpponents.length === 0 && newRetiredList.length >= BASE_PATRON_TYPES.length) {
                    SoundFX.potWin();
                    setGameState(GAME_STATE_BAR_VICTORY);
                    return;
                }

                setRound(r => r + 1);

                let order = [];
                if (lastRoundRankings.length > 0) {
                    const worstToBest = [...lastRoundRankings].reverse();
                    const currentIds = nextOpponents.map(o => o.id);
                    currentIds.push('player');
                    order = worstToBest.map(p => p.id).filter(id => currentIds.includes(id));

                    currentIds.forEach(id => {
                        if (!order.includes(id)) order.unshift(id);
                    });
                } else {
                    order = [...nextOpponents.map(o => o.id), 'player'];
                }

                if (msg) {
                     setMessage(msg.trim());
                     setTimeout(() => setupRound(order, nextOpponents, fundsRef.current, incomingDrink), 2000);
                } else {
                     setupRound(order, nextOpponents, fundsRef.current, incomingDrink);
                }
            };

            const setupRound = (order, currentOpponents, availableFunds, brewBuff) => {
                const roundAnte = brewBuff?.id === 'cabana' ? 15 : CONTRIBUTION;

                if (availableFunds < roundAnte) {
                    setMessage(`Womp. Womp. The House cannot afford the $${roundAnte} ante. GAME OVER.`);
                    setTimeout(() => setGameState('GAME_OVER'), 2000);
                    return;
                }

                setActiveDrinkBuff(brewBuff);
                activeDrinkBuffRef.current = brewBuff;
                setNextDrinkBuff(null);
                nextDrinkBuffRef.current = null;

                const startingMaxRolls = brewBuff?.id === 'niply' ? 4 : (brewBuff?.id === 'marshmallow' ? 2 : 3);
                setRoundMaxRolls(startingMaxRolls);
                roundMaxRollsRef.current = startingMaxRolls;
                setIsCapLocked(false);
                setDoubleTapUsed(false);

                let currentFunds = availableFunds - roundAnte;
                const newOpponents = currentOpponents.map(opp => ({
                    ...opp,
                    money: opp.money - roundAnte,
                    dice: [0,0,0,0,0],
                    hand: null,
                    status: 'Waiting',
                    quote: order[0] === opp.id ? PATRON_QUOTES[opp.name]?.rolling : null
                }));
                const totalPot = (newOpponents.length + 1) * roundAnte;

                setFunds(currentFunds);
                fundsRef.current = currentFunds;
                setPot(totalPot);
                potRef.current = totalPot;

                setPlayerDice([0,0,0,0,0]);
                setPlayerHand(null);
                setHeldDice([false, false, false, false, false]);
                setDicePhysics(Array(5).fill({x:0, y:0, rot:0}));
                setRollsLeft(startingMaxRolls);

                setOpponents(newOpponents);
                opponentsRef.current = newOpponents;
                setTurnOrder(order);
                setCurrentTurnIndex(0);
                setGameState('ROLLING');

                const firstId = order[0];
                if (firstId === 'player') {
                    setMessage(`Ante up ($${roundAnte})! Pot is $${totalPot}. You have The Hammer—set the roll cap!`);
                } else {
                    const opp = newOpponents.find(o => o.id === firstId);
                    const name = opp ? opp.name : "Opponent";
                    setMessage(`Ante up ($${roundAnte})! Pot is $${totalPot}. ${name} has The Hammer and leads off.`);
                }
            };

            const rollDice = () => {
                if (rollsLeft <= 0 || turnOrder[currentTurnIndex] !== 'player') return;

                SoundFX.shakeAndRoll();
                setIsRollingDice(true);
                setTimeout(() => setIsRollingDice(false), 450);

                const newPhysics = dicePhysics.map((p, idx) => {
                    if (heldDice[idx]) return { x: 0, y: 0, rot: 0 };
                    return {
                        x: Math.floor(Math.random() * 14 - 7),
                        y: Math.floor(Math.random() * 10 - 5),
                        rot: Math.floor(Math.random() * 22 - 11)
                    };
                });
                setDicePhysics(newPhysics);

                const newDice = playerDice.map((val, idx) => {
                    if (heldDice[idx] && val !== 0) return val;
                    return Math.ceil(Math.random() * 6);
                });

                setPlayerDice(newDice);
                setRollsLeft(rollsLeft - 1);
            };

            const handleDoubleTap = () => {
                if (doubleTapUsed || fundsRef.current < 10 || gameState !== 'ROLLING') return;
                SoundFX.doubleTapBell();
                setDoubleTapUsed(true);

                const nextFunds = fundsRef.current - 10;
                setFunds(nextFunds);
                fundsRef.current = nextFunds;

                let addedPot = 10;
                const updatedOpps = opponentsRef.current.map(opp => {
                    if (opp.money >= 10) {
                        addedPot += 10;
                        return { ...opp, money: opp.money - 10, quote: "Double Tap?! Raising the stakes!" };
                    }
                    return { ...opp, quote: "Too tapped out to match!" };
                });

                const nextPot = potRef.current + addedPot;
                setPot(nextPot);
                potRef.current = nextPot;
                setOpponents(updatedOpps);
                opponentsRef.current = updatedOpps;
                setMessage(`🔔 DOUBLE TAP! The bell rings and the Pot surges to $${nextPot}!`);
            };

            const checkPlayerInstantBonuses = (finalDice) => {
                const buff = activeDrinkBuffRef.current;
                const hand = evaluateHand(finalDice);
                let bonusCash = 0;
                let note = "";

                if (buff?.id === 'sublime' && has311Combo(finalDice)) {
                    bonusCash += 10;
                    note += " 🎶 3-1-1 Jukebox Bonus (+$10)!";
                }
                if (buff?.id === 'egret' && hand?.rank === HAND_RANKS.STRAIGHT) {
                    bonusCash += 15;
                    note += " 🦢 Lagoon Zen Flight Bonus (+$15)!";
                }

                if (bonusCash > 0) {
                    SoundFX.potWin();
                    const updatedFunds = fundsRef.current + bonusCash;
                    setFunds(updatedFunds);
                    fundsRef.current = updatedFunds;
                    setSessionStats(prev => ({ ...prev, totalEarnings: prev.totalEarnings + bonusCash }));
                }
                return note;
            };

            useEffect(() => {
                 if (gameState === 'ROLLING' && turnOrder[currentTurnIndex] === 'player' && rollsLeft === 0) {
                      const timer = setTimeout(() => {
                           const bonusNote = checkPlayerInstantBonuses(playerDiceRef.current);
                           advanceTurn(null, bonusNote);
                      }, 900);
                      return () => clearTimeout(timer);
                 }
            }, [rollsLeft, currentTurnIndex, gameState]);

            const forceFinish = () => {
                if (turnOrder[currentTurnIndex] !== 'player' || playerDice[0] === 0) return;
                const isLeadRoller = currentTurnIndex === 0;
                const rollsUsed = roundMaxRollsRef.current - rollsLeft;

                const bonusNote = checkPlayerInstantBonuses(playerDiceRef.current);

                if (isLeadRoller && rollsUsed < roundMaxRollsRef.current) {
                    SoundFX.callTheBar();
                    setRoundMaxRolls(rollsUsed);
                    roundMaxRollsRef.current = rollsUsed;
                    setIsCapLocked(true);
                    advanceTurn(rollsUsed, bonusNote);
                } else {
                    setRollsLeft(0);
                }
            };

            const getAIKeeps = (dice, opp, currentBuff) => {
                const keeps = [];
                let effectiveType = opp.type;
                if (currentBuff?.id === 'blood') effectiveType = "Aggressive";
                if (currentBuff?.id === 'egret') effectiveType = "Patient";

                const name = opp.name;

                dice.forEach((d, i) => { if (d === 1) keeps.push(i); });
                const counts = {};
                dice.forEach(d => counts[d] = (counts[d] || 0) + 1);

                if (effectiveType === "Patient" || name === "Loomis") {
                    const straightTargets = [2, 3, 4, 5, 6];
                    const seenValues = new Set();
                    dice.forEach((d, idx) => {
                        if (d === 1) return;
                        if (straightTargets.includes(d) && !seenValues.has(d)) {
                            keeps.push(idx);
                            seenValues.add(d);
                        }
                    });
                    return keeps;
                }

                if (effectiveType === "Calculator") {
                    let bestVal = 0;
                    let maxCount = 0;
                    for (let [val, count] of Object.entries(counts)) {
                        if (Number(val) === 1) continue;
                        if (count > maxCount || (count === maxCount && Number(val) > bestVal)) {
                            maxCount = count;
                            bestVal = Number(val);
                        }
                    }

                    if (maxCount >= 2 || (maxCount === 1 && keeps.length >= 1)) {
                        dice.forEach((d, i) => {
                            if (d === bestVal && !keeps.includes(i)) keeps.push(i);
                        });
                        return keeps;
                    }

                    const uniqueNormals = [...new Set(dice.filter(d => d !== 1))].sort();
                    if (uniqueNormals.length >= 3) {
                        uniqueNormals.forEach(val => {
                            const firstIdx = dice.indexOf(val);
                            if (firstIdx !== -1 && !keeps.includes(firstIdx)) keeps.push(firstIdx);
                        });
                        return keeps;
                    }

                    const highIdx = dice.findIndex(d => d === 6 || d === 5);
                    if (highIdx !== -1 && !keeps.includes(highIdx)) keeps.push(highIdx);
                    return keeps;
                }

                if (effectiveType === "Aggressive") {
                    for (let i = 0; i < 5; i++) {
                        if (keeps.includes(i)) continue;
                        const val = dice[i];
                        if (counts[val] >= 2 || val >= 5) keeps.push(i);
                    }
                    return keeps;
                }

                if (effectiveType === "Conservative") {
                    for (let i = 0; i < 5; i++) {
                        if (keeps.includes(i)) continue;
                        if (counts[dice[i]] >= 2) keeps.push(i);
                    }
                    return keeps;
                }

                dice.forEach((d, i) => {
                    if (!keeps.includes(i) && Math.random() > 0.5) keeps.push(i);
                });

                return keeps;
            };

            const finishRound = (extraNote = "") => {
                setGameState('EVALUATION');
                const finalPHand = evaluateHand(playerDiceRef.current);
                setPlayerHand(finalPHand);

                const finalOpponents = opponentsRef.current.map(opp => ({ ...opp, hand: evaluateHand(opp.dice) }));
                setOpponents(finalOpponents);
                if (extraNote) setMessage(prev => prev + extraNote);

                setTimeout(() => determineWinner(finalPHand, finalOpponents), 950);
            };

            const determineWinner = (pHand, opps) => {
                const safePHand = pHand || { rank: 1, value: 0 };
                const safeOpps = opps.map(o => ({...o, hand: o.hand || {rank:1, value:0}}));

                const allPlayers = [
                    { id: 'player', name: 'You', hand: safePHand },
                    ...safeOpps.map(o => ({ id: o.id, name: o.name, hand: o.hand, money: o.money, typeId: o.typeId }))
                ];

                allPlayers.sort((a, b) => {
                    if (b.hand.rank !== a.hand.rank) return b.hand.rank - a.hand.rank;
                    return b.hand.value - a.hand.value;
                });

                setLastRoundRankings(allPlayers);

                const loser = allPlayers[allPlayers.length - 1];
                const winner = allPlayers[0];
                const losingDrink = ROUND_DRINKS[Math.floor(Math.random() * ROUND_DRINKS.length)];

                setNextDrinkBuff({ ...losingDrink, buyer: loser.name });
                nextDrinkBuffRef.current = { ...losingDrink, buyer: loser.name };

                const currentRoundCost = activeDrinkBuffRef.current?.id === 'blood' ? 30 : BUY_A_ROUND_COST;

                let msg = "";
                let newFunds = fundsRef.current;
                const activePot = potRef.current;

                let wonPotThisRound = false;
                let earningsThisRound = 0;

                if (winner.id === 'player') {
                    SoundFX.potWin();
                    newFunds += activePot;
                    wonPotThisRound = true;
                    earningsThisRound = activePot;
                    msg += `🏆 WINNER: You scooped the $${activePot} Pot! `;
                } else {
                    SoundFX.buyRound();
                    const winnerPatron = opps.find(o => o.id === winner.id);
                    msg += `🏆 WINNER: ${winnerPatron.name} scooped the $${activePot} Pot. `;
                }

                if (loser.id === 'player') {
                    newFunds -= currentRoundCost;
                    msg += `🍺 TAB: You bought ${losingDrink.name} (-$${currentRoundCost}) • Next Tap: [${losingDrink.buffTitle}]`;
                } else {
                    const loserPatron = opps.find(o => o.id === loser.id);
                    msg += `🍺 TAB: ${loserPatron.name} bought ${losingDrink.name} (-$${currentRoundCost}) • Next Tap: [${losingDrink.buffTitle}]`;
                }

                setOpponents(prev => prev.map(o => {
                    let m = o.money;
                    if (o.id === winner.id) m += activePot;
                    if (o.id === loser.id) m = Math.max(0, m - currentRoundCost);

                    const quotes = PATRON_QUOTES[o.name];
                    let reactionQuote = null;
                    if (o.id === winner.id) reactionQuote = quotes?.winner;
                    else if (o.id === loser.id) reactionQuote = quotes?.loser;
                    else if ((o.hand?.rank || 1) >= 5) reactionQuote = quotes?.salty;

                    return { ...o, money: m, quote: reactionQuote };
                }));

                setSessionStats(prev => ({
                    roundsSurvived: prev.roundsSurvived + 1,
                    highestHandRank: Math.max(prev.highestHandRank, safePHand.rank),
                    potsWon: prev.potsWon + (wonPotThisRound ? 1 : 0),
                    totalEarnings: prev.totalEarnings + earningsThisRound
                }));

                setPot(0);
                potRef.current = 0;

                if (newFunds <= 0) {
                    setMessage(`FINAL: ${msg} — 💀 The House is out of money.`);
                    setFunds(0);
                    fundsRef.current = 0;
                    setTimeout(() => {
                        const bgm = document.getElementById('bgm');
                        if (bgm) bgm.pause();
                        setGameState('GAME_OVER');
                    }, 2800);
                } else {
                    setFunds(newFunds);
                    fundsRef.current = newFunds;
                    setMessage(msg);
                    setGameState('ROUND_END');
                }
            };

            const toggleDie = (idx) => {
                if (gameState !== 'ROLLING' || rollsLeft === roundMaxRolls || turnOrder[currentTurnIndex] !== 'player') return;
                if (playerDice[idx] === 0) return;
                const newHeld = [...heldDice];
                newHeld[idx] = !newHeld[idx];
                SoundFX.holdClick(newHeld[idx]);
                setHeldDice(newHeld);
            };

            const currentHandDisplay = useMemo(() => evaluateHand(playerDice), [playerDice]);
            const isPlayerTurn = gameState === 'ROLLING' && turnOrder[currentTurnIndex] === 'player';
            const isPlayerLead = turnOrder[0] === 'player';
            const playerRollsUsed = roundMaxRolls - rollsLeft;

            // Dynamic grid columns so opponent coasters stretch cleanly across the full middle area
            const opponentGridClass = useMemo(() => {
                const count = opponents.length;
                if (count === 1) return "grid-cols-1 max-w-md mx-auto w-full";
                if (count === 2) return "grid-cols-2";
                if (count === 3) return "grid-cols-3";
                if (count === 4) return "grid-cols-2 md:grid-cols-4";
                return "grid-cols-2 md:grid-cols-5";
            }, [opponents.length]);

            return (
                <div className="wood-texture flex flex-col justify-between items-center p-2 md:p-3.5 gap-2">
                    <div className="absolute inset-0 bg-black/30 pointer-events-none"></div>

                    {/* 1. TOP NEON & BRASS HEADER (SHRINK-0) */}
                    <div className="w-full max-w-6xl px-3 py-2 z-30 flex justify-between items-center glass-panel rounded-xl shadow-xl shrink-0">
                        <div className="flex items-center gap-3 flex-wrap">
                            <h1 className="text-base md:text-xl font-western neon-title tracking-wider leading-none">
                                LAW BREWING BAR DICE
                            </h1>
                            <div className="flex items-center gap-2 text-xs font-mono-num">
                                <span title="House Funds" className="flex items-center gap-1 bg-black/60 border border-emerald-700/60 px-2.5 py-0.5 rounded-full text-emerald-400 font-bold">
                                    <Icon name="DollarSign" size={12} className="text-emerald-400"/> {funds}
                                </span>
                                <span title="Current Center Pot" className="flex items-center gap-1 bg-black/60 border border-amber-600/60 px-2.5 py-0.5 rounded-full text-amber-400 font-bold">
                                    <Icon name="Beer" size={12} className="text-amber-400"/> POT: ${pot}
                                </span>
                                {gameState !== 'START' && (
                                    <span className={`hidden sm:inline-block px-2.5 py-0.5 rounded-full font-bold border text-[11px] ${isCapLocked ? 'bg-red-950/90 border-red-500 text-red-300 animate-pulse' : 'bg-stone-900/80 border-stone-700 text-stone-300'}`}>
                                        {isCapLocked ? `🔨 CALLED: ${roundMaxRolls} ${roundMaxRolls === 1 ? 'SHAKE' : 'SHAKES'}` : `MAX SHAKES: ${roundMaxRolls}`}
                                    </span>
                                )}
                            </div>
                        </div>

                        <div className="flex items-center gap-2 shrink-0">
                            {activeDrinkBuff && gameState !== 'START' && (
                                <div title={activeDrinkBuff.buffRule} className="hidden lg:flex items-center gap-1.5 bg-amber-950/90 border border-amber-500/60 px-2.5 py-1 rounded-lg text-[11px]">
                                    <span className="font-black text-amber-400 uppercase">🍺 {activeDrinkBuff.name}:</span>
                                    <span className="text-amber-100">{activeDrinkBuff.buffRule}</span>
                                </div>
                            )}

                            <button
                                onClick={toggleAudio}
                                title={isMuted ? "Unmute Audio & SFX" : "Mute Audio & SFX"}
                                className="p-1.5 text-amber-300/80 hover:text-amber-200 border border-amber-800/60 rounded-lg bg-black/40 transition-colors"
                            >
                                <Icon name={isMuted ? "VolumeOff" : "VolumeOn"} size={14} />
                            </button>

                            <div className="relative cheat-sheet-container">
                                <button className="flex items-center gap-1 text-xs text-amber-200 hover:text-white border border-amber-700/60 px-2.5 py-1 rounded-lg bg-black/40 font-medium">
                                    <Icon name="Help" size={13} /> Ranks
                                </button>
                                <div className="cheat-sheet hidden absolute right-0 top-8 w-64 bg-stone-950 border-2 border-amber-600 rounded-xl p-3.5 shadow-2xl text-xs">
                                    <h3 className="font-western text-amber-400 mb-2 border-b border-amber-900/60 pb-1 tracking-wide">
                                        TAPROOM HAND RANKS
                                    </h3>
                                    <ul className="space-y-1.5 text-stone-300 font-medium">
                                        <li className="flex justify-between"><span><b className="text-amber-400">8.</b> Keg Stand</span> <span className="text-stone-500">5-Kind</span></li>
                                        <li className="flex justify-between"><span><b className="text-amber-400">7.</b> Case of Beer</span> <span className="text-stone-500">4-Kind</span></li>
                                        <li className="flex justify-between"><span><b className="text-amber-400">6.</b> Full Tab</span> <span className="text-stone-500">Full House</span></li>
                                        <li className="flex justify-between"><span><b className="text-amber-400">5.</b> Flight</span> <span className="text-stone-500">Straight</span></li>
                                        <li className="flex justify-between"><span><b className="text-amber-400">4.</b> Six Pack</span> <span className="text-stone-500">3-Kind</span></li>
                                        <li className="flex justify-between"><span><b className="text-amber-400">3.</b> Double Fisted</span> <span className="text-stone-500">2 Pair</span></li>
                                        <li className="flex justify-between"><span><b className="text-amber-400">2.</b> Solo Cup</span> <span className="text-stone-500">1 Pair</span></li>
                                        <li className="flex justify-between"><span><b className="text-amber-400">1.</b> Spilled Drink</span> <span className="text-stone-500">High Die</span></li>
                                    </ul>

                                        <Icon name="Star" size={12} className="text-amber-400"/> Stars (1s) are WILD!
                                    </div>
                                </div>
                            </div>

                            <div className="text-right bg-black/40 border border-amber-900/50 px-2.5 py-0.5 rounded-lg">
                                <div className="text-[8px] text-amber-500/80 uppercase tracking-widest font-bold">Round</div>
                                <div className="text-base font-western text-white leading-tight">{round}</div>
                            </div>
                        </div>
                    </div>

                    {/* 2. CHALKBOARD MARQUEE + MOBILE TAP BUFF (SHRINK-0) */}
                    {gameState !== 'START' && (

                            {activeDrinkBuff && (
                                <div className="lg:hidden bg-amber-950/90 border border-amber-500/60 rounded-lg px-3 py-1 flex items-center justify-between text-[11px]">
                                    <span className="font-black text-amber-400 uppercase">🍺 ON TAP: {activeDrinkBuff.name}</span>
                                    <span className="text-amber-100 truncate ml-2">{activeDrinkBuff.buffRule}</span>

                                    {message}

                                        <h2 className="text-2xl md:text-3xl font-western text-amber-400 tracking-wide">

                                        <div className="bg-black/40 border border-amber-900/50 p-3 rounded-xl flex flex-col items-center gap-2">

                                            <div className="flex gap-2">
