<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Law Brewing Bar Dice</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rye&family=Roboto:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap');

        :root {
            --gold: #eab308;
            --brass: #b45309;
            --mahogany-dark: #160a06;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: #0d0604;
            color: white;
            margin: 0;
            /* Lock scrolling on mobile to keep it an app-like single screen */
            overflow: hidden; 
            touch-action: manipulation;
        }

        #root {
            width: 100%;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .font-western { font-family: 'Rye', serif; }
        .font-mono-num { font-family: 'JetBrains Mono', monospace; }

        /* -------------------------------------------
           BARTOP BACKGROUND
        ------------------------------------------- */
        .wood-texture {
            background-color: var(--mahogany-dark);
            background-image:
                radial-gradient(ellipse at 50% 25%, rgba(245, 158, 11, 0.12) 0%, rgba(0, 0, 0, 0.75) 80%),
                repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.015) 0px, rgba(255, 255, 255, 0.015) 2px, transparent 2px, transparent 9px);
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 4px;
            box-sizing: border-box;
            overflow-y: auto; /* Fallback if screen is microscopic */
        }

        .wood-texture::before {
            content: "";
            position: absolute;
            top: 10%; left: 5%;
            width: 100px; height: 100px;
            border-radius: 50%;
            border: 4px solid rgba(0, 0, 0, 0.2);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.1), 10px 15px 0 -4px rgba(0, 0, 0, 0.1);
            pointer-events: none; z-index: 1;
        }

        /* -------------------------------------------
           NEON & PANELS
        ------------------------------------------- */
        @keyframes neon-flicker {
            0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% {
                text-shadow: 0 0 4px #fef08a, 0 0 8px #eab308, 0 2px 4px rgba(0,0,0,0.9);
            }
            20%, 24%, 55% { text-shadow: 0 2px 4px rgba(0,0,0,0.9); }
        }
        .neon-title { color: #fef08a; animation: neon-flicker 6s infinite; }

        .glass-panel {
            background: linear-gradient(145deg, rgba(32, 22, 17, 0.96) 0%, rgba(18, 12, 9, 0.98) 100%);
            border: 1px solid rgba(217, 119, 6, 0.3);
            box-shadow: 0 6px 15px -4px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        .coaster-card {
            background: radial-gradient(circle at 50% 30%, #291d18 0%, #17100d 100%);
            border: 1px solid #452c1e;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.6);
            position: relative;
        }

        .chalkboard-banner {
            background: #111513;
            border: 2px solid #78350f;
            box-shadow: inset 0 0 12px rgba(0, 0, 0, 0.8);
        }

        /* Floating Speech Bubble */
        @keyframes bubble-pop {
            0% { transform: translate(-50%, 6px) scale(0.7); opacity: 0; }
            100% { transform: translate(-50%, 0) scale(1); opacity: 1; }
        }
        .speech-bubble {
            animation: bubble-pop 0.2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            background: #fef9c3;
            color: #1c1917;
            border: 2px solid #b45309;
            box-shadow: 0 4px 10px rgba(0,0,0,0.7);
            position: absolute;
            bottom: 100%;
            left: 50%;
            width: 140%;
            z-index: 50;
            margin-bottom: 4px;
        }
        .speech-bubble::after {
            content: '';
            position: absolute;
            top: 100%; left: 50%;
            transform: translateX(-50%);
            border-width: 5px 5px 0 5px;
            border-style: solid;
            border-color: #b45309 transparent transparent transparent;
        }

        /* -------------------------------------------
           FELT TRAY & DICE
        ------------------------------------------- */
        .felt-dice-pit {
            background: radial-gradient(ellipse at center, #163d2d 0%, #06140e 100%);
            border: 2px solid #78350f;
            box-shadow: inset 0 4px 15px rgba(0,0,0,0.9), 0 1px 0 rgba(251,191,36,0.1);
            position: relative;
        }

        .dice-face {
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            user-select: none; position: relative;
        }
        .dice-face:active { transform: scale(0.92); }

        .die-ivory {
            background: linear-gradient(145deg, #fffbeb 0%, #d6c3a5 100%);
            border: 1px solid #a89070;
            box-shadow: 0 4px 8px rgba(0,0,0,0.7), 0 2px 0 #8c7355, inset 0 1px 2px rgba(255,255,255,0.8);
        }
        .die-wild-ace {
            background: linear-gradient(145deg, #fef9c3 0%, #ca8a04 100%);
            border: 1px solid #fef08a;
            box-shadow: 0 4px 10px rgba(234,179,8,0.4), 0 2px 0 #854d0e, inset 0 1px 2px rgba(255,255,255,0.9);
        }
        .die-held {
            transform: translateY(-6px) scale(1.04) !important;
            border: 2px solid #facc15 !important;
            box-shadow: 0 8px 12px rgba(0,0,0,0.8), 0 0 12px rgba(234,179,8,0.6), 0 2px 0 #b45309 !important;
        }

        .pip-dot { background: #0f172a; box-shadow: inset 0 1px 2px rgba(0,0,0,0.9); }
        .pip-six-red { background: #991b1b; box-shadow: inset 0 1px 2px rgba(0,0,0,0.8); }

        @keyframes dice-roll {
            0% { transform: translate3d(0, 0, 0) rotate(0deg) scale(1); }
            25% { transform: translate3d(-4px, -8px, 0) rotate(-25deg) scale(1.1); }
            50% { transform: translate3d(6px, 4px, 0) rotate(30deg) scale(0.95); }
            75% { transform: translate3d(-3px, -4px, 0) rotate(-15deg) scale(1.05); }
            100% { transform: translate3d(0, 0, 0) rotate(0deg) scale(1); }
        }
        .rolling-animation { animation: dice-roll 0.4s infinite; }
        .die-physics { transition: transform 0.4s cubic-bezier(0.25, 1.25, 0.5, 1); }

        /* -------------------------------------------
           COMPACT ANIMATIONS & REACTIONS
        ------------------------------------------- */
        .btn-pulse { animation: pulse-yellow 2s infinite; }
        @keyframes pulse-yellow {
            0%, 100% { box-shadow: 0 0 0 0 rgba(234,179,8,0.6); }
            50% { box-shadow: 0 0 0 6px rgba(234,179,8,0); }
        }

        .active-turn { border-color: #eab308 !important; box-shadow: 0 0 15px rgba(234,179,8,0.3) !important; }
        .inactive-turn { opacity: 0.85; }

        .reaction-winner { border-color: #eab308 !important; box-shadow: 0 0 20px rgba(234,179,8,0.8) !important; z-index: 10; transform: scale(1.02); }
        .reaction-loser { filter: grayscale(0.8) brightness(0.65); border-color: #1e293b !important; }
        .reaction-angry { border-color: #ef4444 !important; background: #2a0808 !important; }
        
        .cheat-sheet-container:hover .cheat-sheet { display: block; }
        .cheat-sheet { z-index: 9999; }
    </style>

</head>

        const SoundFX = {

            init() { if (!this.ctx) { const AudioCtx = window.AudioContext || window.webkitAudioContext; if (AudioCtx) this.ctx = new AudioCtx(); } if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
            shakeAndRoll() {
                if (this.muted) return; this.init(); if (!this.ctx) return; const now = this.ctx.currentTime;
                for (let i = 0; i < 4; i++) {
                    const t = now + i * 0.07; const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain();
                    osc.type = 'triangle'; osc.frequency.setValueAtTime(320 + Math.random()*200, t); osc.frequency.exponentialRampToValueAtTime(75, t + 0.04);
                    gain.gain.setValueAtTime(0.12, t); gain.gain.exponentialRampToValueAtTime(0.001, t + 0.04);
                    osc.connect(gain); gain.connect(this.ctx.destination); osc.start(t); osc.stop(t + 0.05);
                }
            },
            holdClick(locking) {

                const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain();
                osc.type = 'triangle'; osc.frequency.setValueAtTime(locking ? 520 : 720, now); osc.frequency.exponentialRampToValueAtTime(locking ? 860 : 420, now + 0.05);
                gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                osc.connect(gain); gain.connect(this.ctx.destination); osc.start(now); osc.stop(now + 0.06);
            },

            James: () => <svg viewBox="0 0 100 100"><rect width="100" height="100" fill="#2a4365"/><path d="M20 50 Q50 10 80 50 L80 60 Q50 20 20 60 Z" fill="#2d3748"/><ellipse cx="50" cy="55" rx="30" ry="35" fill="#fbd38d"/><path d="M20 40 Q50 15 80 40 Q80 20 50 10 Q20 20 20 40 Z" fill="#2d3748"/><path d="M48 55 L50 65 L54 62" fill="none" stroke="#dd6b20" strokeWidth="2"/><rect x="28" y="45" width="16" height="10" rx="2" fill="none" stroke="#1a202c" strokeWidth="2"/><rect x="56" y="45" width="16" height="10" rx="2" fill="none" stroke="#1a202c" strokeWidth="2"/><path d="M30 46 L36 53" stroke="white" strokeWidth="2" strokeLinecap="round"/><line x1="44" y1="50" x2="56" y2="50" stroke="#1a202c" strokeWidth="2"/><circle cx="36" cy="50" r="2" fill="#2b6cb0"/><circle cx="64" cy="50" r="2" fill="#2b6cb0"/><path d="M30 42 Q36 40 42 42" stroke="#1a202c" strokeWidth="2" fill="none"/><path d="M58 42 Q64 40 70 42" stroke="#1a202c" strokeWidth="2" fill="none"/><path d="M42 75 Q50 78 55 74" fill="none" stroke="#c53030" strokeWidth="2"/></svg>,
            Cutter: () => <svg viewBox="0 0 100 100"><rect width="100" height="100" fill="#7b341e"/><circle cx="50" cy="55" r="30" fill="#f6ad55"/><path d="M15 35 Q50 10 85 35 L80 45 Q50 35 20 45 Z" fill="#e53e3e"/><line x1="60" y1="65" x2="70" y2="75" stroke="#c53030" strokeWidth="2"/><line x1="63" y1="68" x2="67" y2="66" stroke="#c53030" strokeWidth="1"/><line x1="20" y1="45" x2="50" y2="60" stroke="#1a202c" strokeWidth="2"/><circle cx="35" cy="52" r="8" fill="#1a202c"/><circle cx="65" cy="52" r="4" fill="#1a202c"/><path d="M28 46 Q35 43 42 46" stroke="#1a202c" strokeWidth="2.5" fill="none"/><path d="M58 46 Q65 43 72 46" stroke="#1a202c" strokeWidth="2.5" fill="none"/><path d="M42 77 Q50 74 58 77" stroke="#1a202c" strokeWidth="3" fill="none"/><line x1="26" y1="74" x2="38" y2="74" stroke="#78350f" strokeWidth="3.5" strokeLinecap="round"/><line x1="22" y1="74" x2="26" y2="74" stroke="#d97706" strokeWidth="3.5" strokeLinecap="round"/><circle cx="21" cy="74" r="2.5" fill="#c53030"/></svg>,

        const HAND_RANKS = { FIVE_OF_A_KIND: 8, FOUR_OF_A_KIND: 7, FULL_HOUSE: 6, STRAIGHT: 5, THREE_OF_A_KIND: 4, TWO_PAIR: 3, ONE_PAIR: 2, HIGH_CARD: 1 };
        const HAND_NAMES = { 8: "Keg Stand (5x)", 7: "Case (4x)", 6: "Full Tab (FH)", 5: "Flight (Str)", 4: "Six Pack (3x)", 3: "Dbl Fisted (2P)", 2: "Solo Cup (1P)", 1: "Spilled (High)" };

        const BASE_PATRON_TYPES = [
            { name: "Pinecone Pete", type: "Conservative", Avatar: Avatars.Pete }, { name: "Rick the Prick", type: "Aggressive", Avatar: Avatars.Rick },
            { name: "Mara Lawson", type: "Random", Avatar: Avatars.Mara }, { name: "James Roberts", type: "Calculator", Avatar: Avatars.James },

        const evaluateHand = (dice) => {
            if (!dice || dice[0] === 0) return null;
            try {
                const counts = {}; let wilds = 0;
                dice.forEach(d => { if (d === 1) wilds++; else counts[d] = (counts[d] || 0) + 1; });
                const uniqueValues = Object.keys(counts).map(Number).sort((a,b) => b-a);
                const maxCount = uniqueValues.length > 0 ? Math.max(...Object.values(counts)) : 0;

                if (maxCount + wilds >= 5) return { rank: 8, value: uniqueValues[0] || 6 };
                if (maxCount + wilds >= 4) return { rank: 7, value: uniqueValues[0] };
                for (let val of uniqueValues) {
                    let w = wilds, c = counts[val];
                    if (c + w >= 3) {
                        let w_remain = w - (3 - c); if (w_remain < 0) w_remain = 0;
                        for (let val2 of uniqueValues) {
                            if (val2 === val) continue;
                            if (counts[val2] + w_remain >= 2) return { rank: 6, value: val * 10 + val2 };
                        }
                    }
                }
                const needed = [2, 3, 4, 5, 6]; let missing = 0;
                needed.forEach(n => { if (!dice.includes(n)) missing++; });
                if (missing <= wilds) return { rank: 5, value: 6 };
                if (maxCount + wilds >= 3) return { rank: 4, value: uniqueValues[0] };

                let pairs = 0, w_temp = wilds;
                for (let val of uniqueValues) {
                    if (counts[val] >= 2) { pairs++; } else if (counts[val] === 1 && w_temp > 0) { pairs++; w_temp--; }
                }
                if (pairs >= 2) return { rank: 3, value: uniqueValues[0] };
                if (maxCount + wilds >= 2) return { rank: 2, value: uniqueValues[0] };
                return { rank: 1, value: Math.max(...dice) };
            } catch (e) { return { rank: 1, value: 1 }; }
        };

        const PipMap = { 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] };
        const renderPips = (val, size) => {
            if (val === 1) return <Icon name="Star" size={size === "large" ? 28 : 14} className="text-amber-600 drop-shadow-[0_1px_0_rgba(255,255,255,0.7)]" />;
            const active = PipMap[val] || [];
            const pipSize = size === "large" ? "w-2.5 h-2.5" : "w-1 h-1";
            return (
                <div className={`grid grid-cols-3 grid-rows-3 w-full h-full ${size==="large" ? "p-1.5 gap-1" : "p-0.5 gap-0.5"} place-items-center`}>
                    {Array(9).fill(null).map((_, i) => <div key={i} className={`rounded-full ${active.includes(i) ? (val===6 ? 'pip-six-red' : 'pip-dot') : 'bg-transparent'} ${pipSize}`}></div>)}
                </div>
            );
        };

        const Die = ({ value, held, onClick, size = "large", isRolling = false, physics = {x:0, y:0, rot:0} }) => {
            const isZero = value === 0 && !isRolling;
            const sizeClass = size === "large" ? "w-12 h-12" : "w-6 h-6 md:w-7 md:h-7";
            if (isZero) return <div className={`${sizeClass} flex items-center justify-center rounded-lg border border-amber-900/40 bg-black/40 text-amber-800/50 shadow-inner`}><Icon name="Beer" size={size === "large" ? 20 : 10} /></div>;
            const displayVal = isRolling && value === 0 ? ((Math.floor(Math.random() * 6)) + 1) : value;
            const style = isRolling ? {} : { transform: `translate3d(${physics.x}px, ${physics.y}px, 0) rotate(${physics.rot}deg)` };
            return (
                <div className="relative flex flex-col items-center">
                    <div onClick={onClick} className={`${sizeClass} flex items-center justify-center rounded-lg cursor-pointer dice-face ${displayVal === 1 ? 'die-wild-ace' : 'die-ivory'} ${held ? 'die-held' : ''} ${isRolling && !held ? 'rolling-animation' : 'die-physics'}`} style={held ? {} : style}>
                        {renderPips(displayVal, size)}
                    </div>
                </div>
            );
        };

        const App = () => {
            const [gameState, setGameState] = useState('START');
            const [numOpponentsToPlay, setNumOpponentsToPlay] = useState(3);
            const [funds, setFunds] = useState(50);
            const [pot, setPot] = useState(0);
            const [round, setRound] = useState(1);
            const [message, setMessage] = useState("Welcome to Law Brewing!");
            const [isMuted, setIsMuted] = useState(false);
            const [activeDrinkBuff, setActiveDrinkBuff] = useState(null);
            const [nextDrinkBuff, setNextDrinkBuff] = useState(null);
            const [roundMaxRolls, setRoundMaxRolls] = useState(3);
            const [isCapLocked, setIsCapLocked] = useState(false);
            const [doubleTapUsed, setDoubleTapUsed] = useState(false);
            
            const [playerDice, setPlayerDice] = useState([0,0,0,0,0]);
            const [heldDice, setHeldDice] = useState([false,false,false,false,false]);
            const [dicePhysics, setDicePhysics] = useState(Array(5).fill({x:0, y:0, rot:0}));
            const [rollsLeft, setRollsLeft] = useState(3);
            const [isRollingDice, setIsRollingDice] = useState(false);
            const [opponents, setOpponents] = useState([]);
            const [turnOrder, setTurnOrder] = useState([]);
            const [currentTurnIndex, setCurrentTurnIndex] = useState(0);
            const [lastRoundRankings, setLastRoundRankings] = useState([]);

            const refs = {
                playerDice: useRef(playerDice), opponents: useRef(opponents), funds: useRef(funds),
                pot: useRef(pot), roundMaxRolls: useRef(roundMaxRolls), activeDrinkBuff: useRef(activeDrinkBuff)
            };
            useEffect(() => { refs.playerDice.current = playerDice; refs.opponents.current = opponents; refs.funds.current = funds; refs.pot.current = pot; refs.roundMaxRolls.current = roundMaxRolls; refs.activeDrinkBuff.current = activeDrinkBuff; }, [playerDice, opponents, funds, pot, roundMaxRolls, activeDrinkBuff]);

            const toggleAudio = () => { setIsMuted(!isMuted); SoundFX.muted = !isMuted; const bgm = document.getElementById('bgm'); if(bgm) bgm.muted = !isMuted; };

            useEffect(() => {
                if (gameState === 'ROLLING') {
                    const activeId = turnOrder[currentTurnIndex];
                    if (activeId !== undefined && activeId !== 'player') {
                        SoundFX.shakeAndRoll();
                        const timer = setTimeout(() => playAITurn(activeId), 900);
                        return () => clearTimeout(timer);
                    }
                }
            }, [currentTurnIndex, gameState, turnOrder]);

            const playAITurn = (aiId) => {
                let leadCalledEarly = false; let newCap = refs.roundMaxRolls.current; let bonusAlert = "";
                const newOpps = refs.opponents.current.map(opp => {
                    if (opp.id === aiId) {
                        let currentDice = [1,1,1,1,1].map(()=>Math.ceil(Math.random()*6)); let rollsUsed = 1;
                        for (let r = 1; r < refs.roundMaxRolls.current; r++) {
                            const evalNow = evaluateHand(currentDice);
                            if (currentTurnIndex === 0 && ((r===1 && evalNow.rank >= 5) || (r===2 && evalNow.rank >= 4))) { leadCalledEarly = true; newCap = r; break; }
                            if (evalNow.rank === 8) break;
                            const keeps = getAIKeeps(currentDice, opp, refs.activeDrinkBuff.current);
                            if (keeps.length === 5) break;
                            currentDice = currentDice.map((d, i) => keeps.includes(i) ? d : Math.ceil(Math.random() * 6));
                            rollsUsed++;
                        }
                        const finalHand = evaluateHand(currentDice);
                        let m = opp.money;
                        if (refs.activeDrinkBuff.current?.id === 'sublime' && currentDice.includes(3) && currentDice.includes(1)) { m += 10; bonusAlert = ` 🎶 +$10 Bonus!`; }
                        if (refs.activeDrinkBuff.current?.id === 'egret' && finalHand.rank === 5) { m += 15; bonusAlert += ` 🦢 +$15 Bonus!`; }
                        return { ...opp, money: m, dice: currentDice, hand: finalHand, quote: leadCalledEarly ? PATRON_QUOTES[opp.name]?.call : null };
                    }
                    return opp;
                });
                if (leadCalledEarly) { SoundFX.callTheBar(); setRoundMaxRolls(newCap); refs.roundMaxRolls.current = newCap; setIsCapLocked(true); }
                setOpponents(newOpps); refs.opponents.current = newOpps;
                advanceTurn(leadCalledEarly ? newCap : null, bonusAlert);
            };

            const advanceTurn = (justCalledCap = null, extraNote = "") => {
                const nextIndex = currentTurnIndex + 1; const capToUse = justCalledCap || refs.roundMaxRolls.current;
                if (nextIndex >= turnOrder.length) finishRound(extraNote);
                else {
                    setCurrentTurnIndex(nextIndex); const nextId = turnOrder[nextIndex];
                    if (nextId === 'player') {
                        setPlayerDice([0,0,0,0,0]); setHeldDice([false,false,false,false,false]); setRollsLeft(capToUse);
                        setMessage(`Your turn! You have ${capToUse} shakes.${extraNote}`);
                    } else {
                        const nextOpp = refs.opponents.current.find(o => o.id === nextId);
                        setOpponents(refs.opponents.current.map(o => o.id === nextId ? { ...o, quote: PATRON_QUOTES[o.name]?.rolling } : o));
                        setMessage(`${nextOpp?.name} is shaking...${extraNote}`);
                    }
                }
            };

            const initializeGame = () => {
                SoundFX.init(); const bgm = document.getElementById('bgm'); if(bgm){ bgm.volume=0.4; bgm.play().catch(()=>{}); }
                setFunds(50); setRound(1); setActiveDrinkBuff(null);
                const initial = BASE_PATRON_TYPES.sort(()=>0.5-Math.random()).slice(0, numOpponentsToPlay).map((p,i)=>({...p, id:i, dice:[0,0,0,0,0], money:50, quote:null, Avatar:getAvatarComponent(p.name)}));
                setupRound([...initial.map(o=>o.id), 'player'], initial, 50, null);
            };

            const setupRound = (order, currentOpponents, availableFunds, brewBuff) => {
                const ante = brewBuff?.id === 'cabana' ? 15 : 10;
                if (availableFunds < ante) { setMessage("The House cannot afford the ante. GAME OVER."); setTimeout(() => setGameState('GAME_OVER'), 2000); return; }
                setActiveDrinkBuff(brewBuff); setNextDrinkBuff(null);
                const startingRolls = brewBuff?.id === 'niply' ? 4 : (brewBuff?.id === 'marshmallow' ? 2 : 3);
                setRoundMaxRolls(startingRolls); setIsCapLocked(false); setDoubleTapUsed(false);
                let currentFunds = availableFunds - ante;
                const newOpps = currentOpponents.map(o => ({...o, money: o.money - ante, dice:[0,0,0,0,0], hand:null, quote: order[0]===o.id ? PATRON_QUOTES[o.name]?.rolling : null}));
                setFunds(currentFunds); setPot((newOpps.length + 1) * ante);
                setPlayerDice([0,0,0,0,0]); setHeldDice([false,false,false,false,false]); setRollsLeft(startingRolls);
                setOpponents(newOpps); setTurnOrder(order); setCurrentTurnIndex(0); setGameState('ROLLING');
                setMessage(`Ante up! Pot is $${(newOpps.length+1)*ante}. ${order[0]==='player' ? 'You have The Hammer!' : 'Opponent leads.'}`);
            };

            const rollDice = () => {
                if (rollsLeft <= 0 || turnOrder[currentTurnIndex] !== 'player') return;
                SoundFX.shakeAndRoll(); setIsRollingDice(true); setTimeout(() => setIsRollingDice(false), 300);
                setDicePhysics(dicePhysics.map((p, i) => heldDice[i] ? {x:0,y:0,rot:0} : {x:Math.floor(Math.random()*10-5), y:Math.floor(Math.random()*6-3), rot:Math.floor(Math.random()*20-10)}));
                setPlayerDice(playerDice.map((val, i) => (heldDice[i] && val!==0) ? val : Math.ceil(Math.random() * 6)));
                setRollsLeft(rollsLeft - 1);
            };

            const handleDoubleTap = () => {
                if (doubleTapUsed || refs.funds.current < 10 || gameState !== 'ROLLING') return;
                SoundFX.doubleTapBell(); setDoubleTapUsed(true);
                setFunds(refs.funds.current - 10);
                let addedPot = 10;
                setOpponents(refs.opponents.current.map(o => {
                    if (o.money >= 10) { addedPot += 10; return { ...o, money: o.money - 10, quote: "Double Tap!" }; }
                    return { ...o, quote: "Too tapped out!" };
                }));
                setPot(refs.pot.current + addedPot);
                setMessage(`🔔 DOUBLE TAP! Pot surges!`);
            };

            useEffect(() => {
                if (gameState === 'ROLLING' && turnOrder[currentTurnIndex] === 'player' && rollsLeft === 0) {
                    const timer = setTimeout(() => {
                        let bonus = "";
                        if(refs.activeDrinkBuff.current?.id === 'sublime' && refs.playerDice.current.includes(3) && refs.playerDice.current.includes(1)) { setFunds(f=>f+10); bonus = " +$10 Bonus!"; }
                        advanceTurn(null, bonus);
                    }, 800);
                    return () => clearTimeout(timer);
                }
            }, [rollsLeft, currentTurnIndex, gameState]);

            const forceFinish = () => {
                if (turnOrder[currentTurnIndex] !== 'player' || playerDice[0] === 0) return;
                if (currentTurnIndex === 0 && (refs.roundMaxRolls.current - rollsLeft) < refs.roundMaxRolls.current) {
                    SoundFX.callTheBar(); const used = refs.roundMaxRolls.current - rollsLeft;
                    setRoundMaxRolls(used); setIsCapLocked(true); advanceTurn(used);
                } else setRollsLeft(0);
            };

            const getAIKeeps = (dice, opp, buff) => {
                const keeps = []; let type = buff?.id==='blood' ? 'Aggressive' : (buff?.id==='egret' ? 'Patient' : opp.type);
                dice.forEach((d, i) => { if (d === 1) keeps.push(i); });
                const counts = {}; dice.forEach(d => counts[d] = (counts[d] || 0) + 1);
                if (type === "Patient" || opp.name === "Loomis") {
                    const seen = new Set(); dice.forEach((d, i) => { if(d!==1 && [2,3,4,5,6].includes(d) && !seen.has(d)){ keeps.push(i); seen.add(d); }});
                    return keeps;
                }
                if (type === "Aggressive") { dice.forEach((d, i) => { if(!keeps.includes(i) && (counts[d]>=2 || d>=5)) keeps.push(i); }); return keeps; }
                dice.forEach((d, i) => { if(!keeps.includes(i) && Math.random()>0.5) keeps.push(i); }); return keeps;
            };

            const finishRound = (extra) => {
                setGameState('EVALUATION'); const finalOpps = refs.opponents.current.map(o => ({ ...o, hand: evaluateHand(o.dice) }));
                setOpponents(finalOpps); if(extra) setMessage(p=>p+extra);
                setTimeout(() => {
                    const pHand = evaluateHand(refs.playerDice.current) || {rank:1,value:0};
                    const all = [{id:'player', name:'You', hand:pHand}, ...finalOpps].sort((a,b) => b.hand.rank !== a.hand.rank ? b.hand.rank - a.hand.rank : b.hand.value - a.hand.value);
                    const winner = all[0], loser = all[all.length-1];
                    const losingDrink = ROUND_DRINKS[Math.floor(Math.random() * ROUND_DRINKS.length)];
                    setNextDrinkBuff(losingDrink);
                    const cost = refs.activeDrinkBuff.current?.id === 'blood' ? 30 : 20;
                    
                    let msg = ""; let newF = refs.funds.current;
                    if (winner.id === 'player') { SoundFX.potWin(); newF += refs.pot.current; msg = `🏆 You scooped $${refs.pot.current}!`; }
                    else { SoundFX.buyRound(); msg = `🏆 ${winner.name} scooped the pot.`; }
                    
                    if (loser.id === 'player') { newF -= cost; msg += `\n🍺 You bought a round of ${losingDrink.name}!`; }
                    else msg += `\n🍺 ${loser.name} bought a round of ${losingDrink.name}!`;

                    setOpponents(finalOpps.map(o => ({ ...o, money: o.id===winner.id ? o.money+refs.pot.current : (o.id===loser.id ? Math.max(0, o.money-cost) : o.money), quote: o.id===winner.id ? PATRON_QUOTES[o.name]?.winner : (o.id===loser.id ? PATRON_QUOTES[o.name]?.loser : null) })));
                    setPot(0);
                    if (newF <= 0) { setMessage(`FINAL: ${msg}\nHouse is out of money.`); setFunds(0); setTimeout(()=>setGameState('GAME_OVER'), 2500); }
                    else { setFunds(newF); setMessage(msg); setGameState('ROUND_END'); }
                }, 1000);
            };

            const toggleDie = (idx) => {
                if (gameState !== 'ROLLING' || rollsLeft === roundMaxRolls || turnOrder[currentTurnIndex] !== 'player' || playerDice[idx] === 0) return;
                const newHeld = [...heldDice]; newHeld[idx] = !newHeld[idx]; SoundFX.holdClick(newHeld[idx]); setHeldDice(newHeld);
            };

            const startRound = () => {
                const incomingBuff = nextDrinkBuff; const ante = incomingBuff?.id === 'cabana' ? 15 : 10;
                const alive = opponents.filter(o => o.money >= ante);
                if (alive.length === 0) { SoundFX.potWin(); setGameState('GAME_OVER'); return; } // Simplified for compact build
                setRound(r=>r+1);
                setupRound([...alive.map(o=>o.id), 'player'], alive, funds, incomingBuff);
            };

            const currentHandDisplay = useMemo(() => evaluateHand(playerDice), [playerDice]);
            const isPlayerTurn = gameState === 'ROLLING' && turnOrder[currentTurnIndex] === 'player';

            return (
                <div className="wood-texture w-full max-w-5xl mx-auto">
                    
                    {/* COMPACT TOP HEADER */}
                    <div className="w-full glass-panel rounded-lg p-1.5 md:p-2 mb-1.5 flex flex-wrap justify-between items-center z-20 gap-1 mt-1">
                        <div className="flex items-center gap-2">
                            <h1 className="text-sm md:text-base font-western neon-title leading-none">LAW BREWING</h1>
                            <div className="flex gap-1.5 text-[10px] font-mono-num font-bold">
                                <span className="bg-black/60 px-1.5 py-0.5 rounded text-emerald-400 border border-emerald-900/50 flex items-center"><Icon name="DollarSign" size={10}/>{funds}</span>
                                <span className="bg-black/60 px-1.5 py-0.5 rounded text-amber-400 border border-amber-900/50 flex items-center">Pot: ${pot}</span>
                            </div>
                        </div>
                        <div className="flex items-center gap-1.5">
                            {activeDrinkBuff && gameState !== 'START' && (
                                <span className="text-[9px] uppercase font-bold text-amber-900 bg-amber-500 px-1.5 py-0.5 rounded shadow">🍺 {activeDrinkBuff.name}</span>
                            )}
                            <button onClick={toggleAudio} className="p-1 text-amber-300 border border-amber-800/50 rounded bg-black/40"><Icon name={isMuted?"VolumeOff":"VolumeOn"} size={12} /></button>
                            <span className="text-[10px] bg-black/40 border border-stone-800 px-1.5 py-0.5 rounded text-stone-300">Rnd {round}</span>
                        </div>
                    </div>

                    {/* MARQUEE */}
                    {gameState !== 'START' && (
                        <div className="w-full chalkboard-banner rounded-lg p-2 text-center text-xs md:text-sm text-amber-100 font-medium mb-1.5 z-10 min-h-[2.5rem] flex items-center justify-center">
                            <span className="message-box">{message}</span>
                        </div>
                    )}

                    {/* DASHBOARD GRID (OPPONENTS) */}
                    {opponents.length > 0 && gameState !== 'START' && (
                        <div className="w-full grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-1.5 mb-1.5 z-10">
                            {opponents.map(opp => {
                                const isMyTurn = gameState === 'ROLLING' && turnOrder[currentTurnIndex] === opp.id;
                                return (
                                    <div key={opp.id} className={`coaster-card p-1.5 rounded-lg flex flex-col items-center ${isMyTurn ? 'active-turn' : 'inactive-turn'}`}>
                                        
                                        <div className="flex items-center gap-1.5 w-full">
                                            <div className="w-8 h-8 rounded-full border border-amber-700 overflow-hidden shrink-0"><opp.Avatar /></div>
                                            <div className="flex flex-col overflow-hidden text-[9px] leading-tight w-full">
                                                <span className="font-bold text-amber-100 truncate">{opp.name}</span>
                                                <span className="text-emerald-400 font-mono-num font-bold">${opp.money}</span>
                                            </div>
                                        </div>

                                        {opp.quote && <div className="speech-bubble px-1.5 py-0.5 text-[9px] text-center font-bold">{opp.quote}</div>}

                                        <div className="flex gap-0.5 mt-1.5 mb-1 justify-center scale-90">
                                            {opp.dice.map((d, i) => <Die key={i} value={d} size="small" isRolling={isMyTurn} />)}
                                        </div>

                                        <div className="text-[8px] font-bold text-amber-400 uppercase text-center w-full truncate">
                                            {isMyTurn ? 'Rolling...' : (opp.hand ? HAND_NAMES[opp.hand.rank].split('(')[0] : '...')}
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    )}

                    {/* START SCREEN */}
                    {gameState === 'START' && (
                        <div className="glass-panel p-4 md:p-6 rounded-xl flex flex-col items-center text-center w-full max-w-lg mt-4 gap-3 z-10">
                            <h2 className="text-xl font-western text-amber-400">High-Stakes Taproom Dice</h2>
                            <p className="text-xs text-stone-300">Ante $10. Stars (1s) are wild. Lead roller sets the shake cap. Worst hand buys a $20 round that buffs the next hand.</p>
                            <div className="flex gap-2 mt-2">
                                {[1, 2, 3, 4, 5].map(cnt => (
                                    <button key={cnt} onClick={() => setNumOpponentsToPlay(cnt)} className={`w-8 h-8 rounded font-western text-sm border ${numOpponentsToPlay === cnt ? 'bg-amber-500 text-black border-yellow-200 scale-105' : 'bg-stone-900 text-stone-400 border-stone-700'}`}>{cnt}</button>
                                ))}
                            </div>
                            <button onClick={initializeGame} className="mt-2 w-full py-2.5 bg-gradient-to-b from-amber-400 to-amber-600 text-black font-bold uppercase rounded-lg shadow-lg text-sm">Open the Taproom</button>
                        </div>
                    )}

                    {/* PLAYER TRAY */}
                    {gameState !== 'START' && (
                        <div className={`glass-panel w-full p-2.5 rounded-xl border-t-2 transition-all ${isPlayerTurn ? 'border-yellow-500 shadow-[0_0_15px_rgba(234,179,8,0.2)]' : 'border-stone-800'} mt-auto mb-2`}>
                            <div className="flex justify-between items-center mb-1.5">
                                <div className="text-xs font-western text-amber-400">
                                    THE HOUSE TRAY {turnOrder[0]==='player' && <span className="ml-1 text-[8px] bg-amber-500/20 px-1.5 rounded">🔨 LEAD</span>}
                                </div>
                                <div className="flex gap-1">
                                    {Array.from({length: roundMaxRolls}, (_, i) => i+1).map(r => <span key={r} className={`w-2 h-2 rounded-full ${r<=rollsLeft ? 'bg-amber-400' : 'bg-stone-800'}`}/>)}
                                </div>
                            </div>
                            
                            <div className="felt-dice-pit rounded-xl py-3 px-2 mb-2 flex justify-center items-center gap-1.5 md:gap-3 min-h-[4.5rem]">
                                {playerDice.map((val, i) => <Die key={i} value={val} held={heldDice[i]} onClick={()=>toggleDie(i)} isRolling={isRollingDice} physics={dicePhysics[i]} />)}
                            </div>

                            <div className="flex justify-center gap-2 flex-wrap">
                                {gameState === 'ROLLING' && isPlayerTurn && rollsLeft > 0 && (
                                    <button onClick={rollDice} className="btn-pulse px-4 py-2 bg-gradient-to-b from-amber-400 to-amber-600 text-black font-bold rounded-lg text-xs flex items-center gap-1"><Icon name="RefreshCw" size={12}/> SHAKE</button>
                                )}
                                {gameState === 'ROLLING' && isPlayerTurn && playerDice[0] !== 0 && rollsLeft > 0 && (
                                    <button onClick={forceFinish} className="px-4 py-2 bg-stone-800 text-amber-200 font-bold rounded-lg text-xs border border-amber-700/50"><Icon name="Check" size={12}/> STAND</button>
                                )}
                                {gameState === 'ROLLING' && isPlayerTurn && playerDice[0] !== 0 && !doubleTapUsed && funds >= 10 && (
                                    <button onClick={handleDoubleTap} className="px-3 py-2 bg-red-700 text-white font-bold rounded-lg text-[10px]"><Icon name="Bell" size={10}/> DOUBLE TAP</button>
                                )}
                                {gameState === 'ROUND_END' && (
                                    <button onClick={startRound} className="w-full py-2 bg-emerald-600 text-white font-bold rounded-lg text-xs">NEXT ROUND</button>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
