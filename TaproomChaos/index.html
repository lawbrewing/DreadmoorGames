<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Taproom Chaos | Dreadmoor Games</title>

    <!-- PWA Continuity -->
    <meta name="theme-color" content="#09090b">
    <link rel="manifest" href="../manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">

    <!-- Mobile-First Viewport & Unified Sliding Drawer Styling -->
    <style>
        html, body {
            margin: 0;
            padding: 0;
            background-color: #09090b;
            overflow: hidden;
            overscroll-behavior: none;
            touch-action: none;
            width: 100vw;
            height: 100vh;
            width: 100dvw;
            height: 100dvh;
            position: fixed;
            inset: 0;
        }

        #gameContainer {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            width: 100dvw;
            height: 100dvh;
            background: #000;
            overflow: hidden;
        }

        canvas {
            position: absolute;
            inset: 0;
            width: 100% !important;
            height: 100% !important;
            object-fit: fill !important; /* Stretches full 1280x720 edge-to-edge without cropping or touch offset */
            display: block;
        }

        /* --- PORTRAIT MODE WARNING --- */
        #portraitWarning {
            display: none;
            position: absolute;
            z-index: 9999;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            color: white;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Oswald', sans-serif;
            font-size: 24px;
            text-align: center;
        }

        @media screen and (orientation: portrait) {
            #portraitWarning {
                display: flex;
            }

            #gameCanvas, .hud-panel, #btnToggleHUD {
                display: none !important;
            }
        }

        /* --- UNIFIED COLLAPSIBLE HUD DRAWER (BOTH BREWING & TAPROOM) --- */
        #brewingHUD,
        #taproomHUD {
            position: absolute;
            z-index: 100;
            top: 0;
            left: 0;
            height: 100%;
            width: 300px;
            max-width: 80vw;
            background: rgba(24, 24, 27, 0.96);
            border-right: 2px solid #3f3f46;
            padding: 74px 18px 20px 18px;
            color: #f4f4f5;
            box-sizing: border-box;
            box-shadow: 5px 0 20px rgba(0, 0, 0, 0.85);
            transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
            transform: translateX(-100%);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            pointer-events: none;
        }

            #brewingHUD.open,
            #taproomHUD.open {
                transform: translateX(0);
                pointer-events: auto;
            }

        #btnToggleHUD {
            position: absolute;
            top: 16px;
            left: 16px;
            z-index: 110;
            background: #6366f1;
            color: white;
            border: 2px solid #818cf8;
            padding: 8px 16px;
            font-family: 'Oswald', sans-serif;
            font-size: 18px;
            letter-spacing: 1px;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.6);
            user-select: none;
        }

            #btnToggleHUD:hover {
                background: #4f46e5;
            }

        .hud-library-link {
            display: block;
            margin-top: auto;
            padding: 12px;
            text-align: center;
            background: #18181b;
            color: #a1a1aa;
            border: 1px solid #3f3f46;
            border-radius: 6px;
            font-family: 'Oswald', sans-serif;
            text-decoration: none;
            font-size: 15px;
            letter-spacing: 0.8px;
            transition: all 0.2s ease;
        }

            .hud-library-link:hover {
                background: #27272a;
                color: #f4f4f5;
                border-color: #71717a;
            }

        /* Responsive UI Scaling */
        .hud-panel h2 {
            margin-top: 0;
            margin-bottom: 8px;
            font-size: clamp(16px, 2vw, 22px);
        }

        .hud-panel p, .hud-panel ul {
            font-size: clamp(13px, 1.6vw, 16px);
            margin-top: 4px;
        }

        .hud-panel button {
            font-size: clamp(14px, 1.8vw, 18px);
            padding: 12px;
        }
    </style>
</head>
<body>
    <div class="noise-overlay"></div>

    <!-- Portrait Warning -->
    <div id="portraitWarning">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="white" style="margin-bottom: 20px;"><path d="M16.48 2.52c3.27 1.55 5.61 4.72 5.97 8.48h1.5C23.44 4.84 18.29 0 12 0l-.66.03 3.81 3.81 1.33-1.32zm-6.25-.77c-.59-.59-1.54-.59-2.12 0L1.75 8.11c-.59.59-.59 1.54 0 2.12l12.02 12.02c.59.59 1.54.59 2.12 0l6.36-6.36c.59-.59.59-1.54 0-2.12L10.23 1.75zm4.6 19.46L2.81 9.17l6.36-6.36 12.02 12.02-6.36 6.36z" /></svg>
        PLEASE ROTATE DEVICE<br>TO LANDSCAPE
    </div>

    <!-- Unified HUD Toggle Button (Works in both Brewing and Taproom phases!) -->
    <button id="btnToggleHUD">☰ MENU</button>

    <!-- Responsive Game Viewport -->
    <div id="gameContainer">
        <canvas id="gameCanvas" width="1280" height="720" style="position: absolute; top: 0; left: 0;"></canvas>

        <!-- FORECAST TICKER -->
        <div id="forecastTicker" style="position: absolute; top: 2%; left: 20%; width: 60%; text-align: center; color: #38bdf8; font-family: 'Inter'; font-weight: bold; background: rgba(0,0,0,0.5); padding: 5px; border-radius: 8px; pointer-events: none; z-index: 95; display: none; font-size: clamp(12px, 1.5vw, 18px);">
        </div>

        <!-- TAPROOM HUD DRAWER -->
        <div id="taproomHUD" class="hud-panel">
            <h2 style="color: #dc2626; font-family: 'Oswald';">ON TAP</h2>
            <h2 id="hudTimer" style="color: #facc15; font-family: 'Oswald'; margin-top: 8px;">TIME LEFT: 60s</h2>
            <p id="hudTaproomTips" style="font-family: 'Inter'; color: #4ade80; font-weight: 600; margin-bottom: 12px;">Tips: $0</p>
            <ul id="ammoList" style="list-style: none; padding: 0; font-weight: bold; font-family: 'Inter'; margin-bottom: 16px;">
            </ul>
            <a href="../index.html" class="hud-library-link">❮ BACK TO LIBRARY</a>
        </div>

        <!-- BREWING HUD DRAWER -->
        <div id="brewingHUD" class="hud-panel">
            <h2 style="color: #dc2626; font-family: 'Oswald';">BREWERY BALANCE</h2>
            <p id="hudTips" style="font-family: 'Inter'; color: #4ade80; font-weight: 600;">Tips: $0.00</p>

            <h2 style="color: #dc2626; font-family: 'Oswald'; margin-top: 16px;">INVENTORY</h2>
            <ul id="inventoryList" style="list-style: none; padding: 0; font-family: 'Inter';">
            </ul>
            <button id="btnOpenRecipeBook" style="width: 100%; margin-top: 12px; font-family: 'Oswald'; background: #6366f1; color: white; border: none; cursor: pointer; border-radius: 6px;">
                📖 RECIPE BOOK
            </button>
            <button id="btnStartShift" style="width: 100%; margin-top: 12px; font-family: 'Oswald'; background: #10b981; color: white; border: none; cursor: pointer; font-weight: bold; border-radius: 6px;">
                OPEN TAPROOM
            </button>

            <!-- PREMIUM JUKEBOX CONTROLS -->
            <div class="jukebox-controls" style="margin-top: 20px; margin-bottom: 16px; padding: 12px; background: rgba(0,0,0,0.4); border-radius: 8px; text-align: center;">
                <h4 style="margin: 0 0 10px 0; color: #facc15; font-family: 'Oswald', sans-serif;">🎵 Jukebox</h4>
                <button id="btn-mute-music" style="padding: 8px 12px; margin-right: 5px; cursor: pointer; font-family: 'Oswald', sans-serif;">Mute</button>
                <button id="btn-skip-track" style="padding: 8px 12px; cursor: pointer; background: #3b82f6; color: white; border: none; font-family: 'Oswald', sans-serif;">Skip Track ($1.00)</button>
            </div>

            <!-- NEW: SAVE BUTTON INTEGRATION -->
            <button id="btnSaveGame" class="menu-btn" style="background: #8b5cf6; color: white; border: 2px solid #a855f7; margin-bottom: 15px; cursor: pointer; border-radius: 6px; font-family: 'Oswald';">💾 SAVE PROGRESS</button>

            <a href="../index.html" class="hud-library-link">❮ BACK TO LIBRARY</a>
        </div>

        <!-- RECIPE BOOK OVERLAY -->
        <div id="recipeBookOverlay" style="position: absolute; z-index: 150; display: none; top: 5%; left: 5%; width: 90%; height: 90%; background: #18181b; border: 4px solid #6366f1; border-radius: 12px; color: #f4f4f5; padding: 2%; box-sizing: border-box; overflow-y: auto; font-family: 'Inter';">
            <h1 style="font-family: 'Oswald'; color: #818cf8; margin-top: 0; font-size: clamp(20px, 3vw, 36px);">BREWMASTER'S LOG</h1>
            <button id="btnCloseRecipeBook" style="position: absolute; top: 2%; right: 2%; background: #ef4444; color: white; border: none; padding: 1% 2%; font-weight: bold; cursor: pointer; border-radius: 4px; font-size: clamp(12px, 1.5vw, 16px);">CLOSE</button>
            <div id="recipeListContainer" style="display: grid; grid-template-columns: 1fr 1fr; gap: 2%;">
            </div>
        </div>

        <!-- GAME OVER OVERLAY -->
        <div id="gameOverScreen" style="position: absolute; z-index: 200; display: none; top: 0; left: 0; width: 100%; height: 100%; background: rgba(9, 9, 11, 0.94); flex-direction: column; justify-content: center; align-items: center; color: #f4f4f5;">
            <h1 style="color: #ef4444; font-family: 'Oswald'; margin: 0; text-shadow: 2px 2px 10px rgba(239,68,68,0.5); font-size: clamp(36px, 6vw, 76px);">BANKRUPT!</h1>
            <p style="font-family: 'Inter'; color: #a1a1aa; margin: 6px 0 14px 0; font-size: clamp(14px, 1.8vw, 20px);">You ran out of tips and lost the brewery.</p>

            <div id="gameOverStatsBox" style="background: #18181b; border: 1px solid #3f3f46; border-radius: 10px; padding: 14px 22px; min-width: 280px; margin-bottom: 14px; font-family: 'Inter'; font-size: 14px; line-height: 1.7;">
            </div>

            <div style="display: flex; gap: 12px; margin-top: 15px;">
                <button id="btnRestart" style="padding: 12px 28px; font-family: 'Oswald'; font-size: clamp(16px, 2vw, 22px); font-weight: bold; cursor: pointer; background: #dc2626; color: white; border: none; border-radius: 8px;">TRY AGAIN</button>
                <a href="../index.html" style="padding: 12px 24px; font-family: 'Oswald'; font-size: clamp(16px, 2vw, 22px); text-decoration: none; background: #27272a; color: #e4e4e7; border: 1px solid #52525b; border-radius: 8px;">LIBRARY</a>
            </div>
        </div>
    </div>

    <!-- THE BOUNCER / START SCREEN (Captures Audio Autoplay Context Safely) -->
    <div id="startScreen" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(9, 9, 11, 0.98); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999;">
        <h1 style="color: #facc15; font-family: 'Oswald', sans-serif; font-size: 54px; margin-bottom: 5px; text-shadow: 0 0 20px rgba(250, 204, 21, 0.4);">TAPROOM CHAOS</h1>
        <p style="color: #a1a1aa; font-family: 'Inter', sans-serif; margin-bottom: 40px; letter-spacing: 2px;">DREADMOOR GAMES NETWORK</p>

        <!-- NEW PLAYER -->
        <div id="loginBox" style="background: #18181b; padding: 35px; border: 2px solid #3f3f46; border-radius: 12px; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.8);">
            <label style="color: #f4f4f5; font-family: 'Oswald', sans-serif; font-size: 22px; display: block; margin-bottom: 20px;">ENTER BREWER NAME</label>
            <input type="text" id="playerNameInput" maxlength="10" placeholder="e.g. LOOMIS" style="background: #09090b; color: #4ade80; border: 2px solid #52525b; border-radius: 6px; padding: 12px; font-size: 28px; font-family: 'Oswald', sans-serif; text-align: center; text-transform: uppercase; width: 220px; margin-bottom: 25px; outline: none;">
            <br>
            <button id="btnSubmitName" style="background: #22c55e; color: #052e16; border: none; padding: 14px 40px; font-size: 22px; font-weight: bold; font-family: 'Oswald', sans-serif; border-radius: 6px; cursor: pointer; text-transform: uppercase; box-shadow: 0 4px 0 #15803d; width: 100%;">CLOCK IN</button>
        </div>

        <!-- RETURNING PLAYER -->
        <div id="welcomeBackBox" style="display: none; background: #18181b; padding: 35px; border: 2px solid #3f3f46; border-radius: 12px; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.8);">
            <label style="color: #a1a1aa; font-family: 'Oswald', sans-serif; font-size: 18px; display: block; margin-bottom: 5px;">WELCOME BACK,</label>
            <h2 id="welcomeName" style="color: #4ade80; font-family: 'Oswald', sans-serif; font-size: 42px; margin-bottom: 25px; text-transform: uppercase; letter-spacing: 1px;">PLAYER</h2>
            <button id="btnResumeGame" style="background: #38bdf8; color: #082f49; border: none; padding: 14px 40px; font-size: 22px; font-weight: bold; font-family: 'Oswald', sans-serif; border-radius: 6px; cursor: pointer; text-transform: uppercase; box-shadow: 0 4px 0 #0284c7; margin-bottom: 20px; width: 100%;">RESUME SHIFT</button>
            <br>
            <button id="btnSwitchUser" style="background: transparent; color: #71717a; border: 1px solid #52525b; padding: 8px 20px; font-size: 14px; font-family: 'Inter', sans-serif; border-radius: 4px; cursor: pointer;">Not you? Switch User</button>
        </div>
    </div>

    <!-- Scripts (Cache-busted to v3 to guarantee mobile updates) -->
    <script src="js/core/events.js?v=3"></script>
    <script src="js/core/audio.js?v=3"></script>
    <script src="js/core/input.js?v=3"></script>
    <script src="js/core/renderer.js?v=3"></script>
    <script src="js/config/economy.js?v=3"></script>
    <script src="js/config/population.js?v=3"></script>
    <script src="js/config/recipes.js?v=3"></script>
    <script src="js/config/patrons.js?v=3"></script>
    <script src="js/data/megaPack.js?v=3"></script>
    <script src="js/engine/SpriteManager.js?v=3"></script>
    <script src="js/state/player.js?v=3"></script>
    <script src="js/state/progression.js?v=3"></script>
    <script src="js/entities/patron.js?v=3"></script>
    <script src="js/entities/title.js?v=3"></script>
    <script src="js/ui/hud.js?v=3"></script>
    <script src="js/phases/brewing.js?v=3"></script>
    <script src="js/phases/taproom.js?v=3"></script>
    <script src="js/main.js?v=3"></script>
</body>
</html>
