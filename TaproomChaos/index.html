<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Taproom Chaos | Dreadmoor Games</title>

    <!-- PWA Continuity (Keeps it fullscreen if launched from the hub) -->
    <meta name="theme-color" content="#09090b">
    <link rel="manifest" href="../manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- Fonts matching the Library -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Oswald:wght@500;700&display=swap" rel="stylesheet">

    <!-- Link to the game's specific CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- The Dreadmoor Gritty Overlay -->
    <div class="noise-overlay"></div>

    <!-- Game Viewport -->
    <div id="gameContainer" style="position: relative; width: 1280px; height: 720px; overflow: hidden; margin: 0 auto; background: #000;">
        <canvas id="gameCanvas" width="1280" height="720" style="position: absolute; top: 0; left: 0;"></canvas>

        <!-- TAPROOM HUD -->
        <div id="taproomHUD" class="hud-panel" style="position: absolute; z-index: 100; display: none; top: 10px; left: 10px; background: rgba(9, 9, 11, 0.8); padding: 15px; border-radius: 8px; color: #f4f4f5;">
            <h2 style="color: #dc2626; font-family: 'Oswald'; margin-top: 0;">ON TAP:</h2>
            <h2 id="hudTimer" style="color: #facc15; font-family: 'Oswald'; margin-top: 30px;">TIME LEFT: 60s</h2>
            <ul id="ammoList" style="list-style: none; padding: 0; font-size: 20px; font-weight: bold; font-family: 'Inter';">
                <!-- Ammo items injected here via JS -->
            </ul>
        </div>

        <!-- BREWING HUD -->
        <div id="brewingHUD" class="hud-panel" style="position: absolute; z-index: 100; display: none; top: 0; left: 0; width: 250px; height: 100%; background: #27272a; padding: 20px; color: #f4f4f5; box-sizing: border-box;">
            <h2 style="color: #dc2626; font-family: 'Oswald'; margin-top: 0;">TIP INJECTION</h2>
            <p id="hudTips" style="font-family: 'Inter'; font-size: 18px;">Tips: $0.00</p>
            <button id="btnInject" style="width: 100%; padding: 10px; font-family: 'Inter'; font-size: 16px; cursor: pointer; background: transparent; border: 2px solid #f4f4f5; color: #f4f4f5; font-weight: bold;">
                + Galaxy Hop
            </button>

            <h2 style="color: #dc2626; font-family: 'Oswald'; margin-top: 40px;">INVENTORY</h2>
            <ul id="inventoryList" style="list-style: none; padding: 0; font-family: 'Inter';">
                <!-- Inventory items injected here -->
            </ul>
            <button id="btnStartShift" style="width: 100%; padding: 15px; margin-top: 30px; font-family: 'Oswald'; font-size: 20px; background: #10b981; color: white; border: none; cursor: pointer; font-weight: bold;">
                OPEN TAPROOM
            </button>
        </div>

        <!-- GAME OVER OVERLAY -->
        <div id="gameOverScreen" style="position: absolute; z-index: 200; display: none; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); flex-direction: column; justify-content: center; align-items: center; color: #f4f4f5;">
            <h1 style="color: #ef4444; font-family: 'Oswald'; font-size: 100px; margin: 0; text-shadow: 2px 2px 10px rgba(239,68,68,0.5);">BANKRUPT!</h1>
            <p style="font-family: 'Inter'; font-size: 24px;">You ran out of tips and lost the brewery.</p>
            <button id="btnRestart" style="margin-top: 30px; padding: 15px 40px; font-family: 'Oswald'; font-size: 24px; font-weight: bold; cursor: pointer; background: #dc2626; color: white; border: none; border-radius: 8px;">TRY AGAIN</button>
        </div>

        <!-- UI Overlay for Menus, HUD, and the Exit Button -->
        <div id="ui-layer">
            <a href="../index.html" id="btn-exit" class="dread-btn">❮ BACK TO LIBRARY</a>

            <!-- ADD THIS TEST BUTTON -->
            <button id="test-toggle-phase" style="position: absolute; top: 20px; right: 20px; padding: 10px 20px; background: #dc2626; color: white; border: none; font-family: 'Oswald', sans-serif; cursor: pointer; pointer-events: auto; z-index: 100;">
                TEST: TOGGLE PHASE
            </button>
        </div>

        <!-- Engine Scripts will go here -->
        <script src="js/core/events.js"></script>
        <script src="js/core/renderer.js"></script>
        <script src="js/utils/input.js"></script>
        <!-- State Managers -->
        <script src="js/state/player.js"></script>
        <script src="js/state/progression.js"></script> <!-- ADD THIS -->
        <!-- Configs -->
        <script src="js/config/recipes.js"></script>
        <script src="js/config/economy.js"></script>
        <script src="js/config/population.js"></script>
        <script src="js/ui/hud.js"></script>
        <!-- Entities -->
        <script src="js/entities/patron.js"></script>
        <script src="js/entities/title.js"></script>
        <!-- Phases -->
        <script src="js/phases/taproom.js"></script>
        <script src="js/phases/brewing.js"></script>
        <script src="js/main.js"></script>
</body>
</html>
