<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Taproom Chaos | Dreadmoor Games</title>

    <!-- PWA Continuity -->
    <meta name="theme-color" content="#09090b">
    <link rel="manifest" href="../manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">

    <!-- Mobile-First Viewport & UI Scaling -->
    <!-- Mobile-First Viewport & UI Scaling -->
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #09090b;
            overflow: hidden;
            touch-action: none;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
        }

        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh; /* Fills screen completely */
            background: #000;
            overflow: hidden;
        }

        canvas {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover; /* Eliminates black bars, fills screen */
            display: block;
        }

        /* --- PORTRAIT MODE WARNING --- */
        #portraitWarning {
            display: none;
            position: absolute;
            z-index: 9999;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            color: white;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Oswald', sans-serif;
            font-size: 24px;
            text-align: center;
        }

        @media screen and (orientation: portrait) {
            #portraitWarning {
                display: flex;
            }

            #gameCanvas, .hud-panel, #btnToggleHUD {
                display: none !important;
            }
        }

        /* --- COLLAPSIBLE BREWERY HUD DRAWER --- */
        #brewingHUD {
            transition: transform 0.3s ease;
            transform: translateX(-100%); /* Hidden by default */
            width: 300px;
            max-width: 80vw;
            box-shadow: 5px 0 15px rgba(0,0,0,0.8);
        }

            #brewingHUD.open {
                transform: translateX(0); /* Slides in */
            }

        #btnToggleHUD {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 101;
            background: #6366f1;
            color: white;
            border: none;
            padding: 10px 15px;
            font-family: 'Oswald';
            font-size: 20px;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
        }

        /* Responsive UI Scaling */
        .hud-panel h2 {
            margin-top: 0;
            font-size: clamp(16px, 2.5vw, 24px);
        }

        .hud-panel p, .hud-panel ul {
            font-size: clamp(14px, 2vw, 20px);
        }

        .hud-panel button {
            font-size: clamp(14px, 2vw, 20px);
            padding: 15px;
        }
    </style>
</head>
<body>
    <div class="noise-overlay"></div>

    <!-- Portrait Warning -->
    <div id="portraitWarning">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="white" style="margin-bottom: 20px;"><path d="M16.48 2.52c3.27 1.55 5.61 4.72 5.97 8.48h1.5C23.44 4.84 18.29 0 12 0l-.66.03 3.81 3.81 1.33-1.32zm-6.25-.77c-.59-.59-1.54-.59-2.12 0L1.75 8.11c-.59.59-.59 1.54 0 2.12l12.02 12.02c.59.59 1.54.59 2.12 0l6.36-6.36c.59-.59.59-1.54 0-2.12L10.23 1.75zm4.6 19.46L2.81 9.17l6.36-6.36 12.02 12.02-6.36 6.36z" /></svg>
        PLEASE ROTATE DEVICE<br>TO LANDSCAPE
    </div>

    <!-- HUD Toggle Button -->
    <button id="btnToggleHUD" onclick="document.getElementById('brewingHUD').classList.toggle('open')">☰ MENU</button>

    <!-- Responsive Game Viewport -->
    <div id="gameContainer">
        <!-- Internal resolution remains 1280x720, CSS handles the physical screen scaling -->
        <canvas id="gameCanvas" width="1280" height="720" style="position: absolute; top: 0; left: 0;"></canvas>

        <!-- FORECAST TICKER -->
        <div id="forecastTicker" style="position: absolute; top: 2%; left: 20%; width: 60%; text-align: center; color: #38bdf8; font-family: 'Inter'; font-weight: bold; background: rgba(0,0,0,0.5); padding: 5px; border-radius: 8px; pointer-events: none; z-index: 100; display: none; font-size: clamp(12px, 1.5vw, 18px);">
            <!-- Javascript will inject the forecast here -->
        </div>

        <!-- TAPROOM HUD -->
        <div id="taproomHUD" class="hud-panel" style="position: absolute; z-index: 100; display: none; top: 2%; left: 2%; background: rgba(9, 9, 11, 0.8); padding: 2%; border-radius: 8px; color: #f4f4f5; max-width: 25%;">
            <h2 style="color: #dc2626; font-family: 'Oswald';">ON TAP:</h2>
            <h2 id="hudTimer" style="color: #facc15; font-family: 'Oswald'; margin-top: 15%;">TIME LEFT: 60s</h2>
            <ul id="ammoList" style="list-style: none; padding: 0; font-weight: bold; font-family: 'Inter';">
            </ul>
        </div>

        <!-- BREWING HUD -->
        <div id="brewingHUD" class="hud-panel" style="position: absolute; z-index: 100; top: 0; left: 0; height: 100%; background: #27272a; padding: 2%; color: #f4f4f5; box-sizing: border-box;">
            <h2 style="color: #dc2626; font-family: 'Oswald';">BREWERY BALANCE</h2>
            <p id="hudTips" style="font-family: 'Inter';">Tips: $0.00</p>

            <h2 style="color: #dc2626; font-family: 'Oswald'; margin-top: 15%;">INVENTORY</h2>
            <ul id="inventoryList" style="list-style: none; padding: 0; font-family: 'Inter';">
            </ul>
            <button id="btnOpenRecipeBook" style="width: 100%; margin-top: 10%; font-family: 'Oswald'; background: #6366f1; color: white; border: none; cursor: pointer; border-radius: 4px;">
                📖 RECIPE BOOK
            </button>
            <button id="btnStartShift" style="width: 100%; margin-top: 15%; font-family: 'Oswald'; background: #10b981; color: white; border: none; cursor: pointer; font-weight: bold; border-radius: 4px;">
                OPEN TAPROOM
            </button>
        </div>

        <!-- RECIPE BOOK OVERLAY -->
        <div id="recipeBookOverlay" style="position: absolute; z-index: 150; display: none; top: 5%; left: 5%; width: 90%; height: 90%; background: #18181b; border: 4px solid #6366f1; border-radius: 12px; color: #f4f4f5; padding: 2%; box-sizing: border-box; overflow-y: auto; font-family: 'Inter';">
            <h1 style="font-family: 'Oswald'; color: #818cf8; margin-top: 0; font-size: clamp(20px, 3vw, 36px);">BREWMASTER'S LOG</h1>
            <button id="btnCloseRecipeBook" style="position: absolute; top: 2%; right: 2%; background: #ef4444; color: white; border: none; padding: 1% 2%; font-weight: bold; cursor: pointer; border-radius: 4px; font-size: clamp(12px, 1.5vw, 16px);">CLOSE</button>
            <div id="recipeListContainer" style="display: grid; grid-template-columns: 1fr 1fr; gap: 2%;">
            </div>
        </div>

        <!-- GAME OVER OVERLAY -->
        <div id="gameOverScreen" style="position: absolute; z-index: 200; display: none; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); flex-direction: column; justify-content: center; align-items: center; color: #f4f4f5;">
            <h1 style="color: #ef4444; font-family: 'Oswald'; margin: 0; text-shadow: 2px 2px 10px rgba(239,68,68,0.5); font-size: clamp(40px, 8vw, 100px);">BANKRUPT!</h1>
            <p style="font-family: 'Inter'; font-size: clamp(16px, 2vw, 24px);">You ran out of tips and lost the brewery.</p>
            <button id="btnRestart" style="margin-top: 5%; padding: 2% 5%; font-family: 'Oswald'; font-size: clamp(16px, 2.5vw, 24px); font-weight: bold; cursor: pointer; background: #dc2626; color: white; border: none; border-radius: 8px;">TRY AGAIN</button>
        </div>

        <!-- UI Overlay -->
        <div id="ui-layer">
            <a href="../index.html" id="btn-exit" class="dread-btn" style="font-size: clamp(12px, 1.5vw, 16px);">❮ BACK TO LIBRARY</a>
            <button id="test-toggle-phase" style="position: absolute; top: 2%; right: 2%; padding: 1% 2%; background: #dc2626; color: white; border: none; font-family: 'Oswald', sans-serif; cursor: pointer; pointer-events: auto; z-index: 100; font-size: clamp(10px, 1.2vw, 16px);">
                TEST: TOGGLE PHASE
            </button>
        </div>
    </div> <!-- END GAME CONTAINER -->
    <!-- Scripts -->
    <script src="js/core/events.js"></script>
    <script src="js/core/audio.js"></script>
    <script src="js/core/input.js"></script>
    <script src="js/core/renderer.js"></script>
    <script src="js/config/economy.js"></script>
    <script src="js/config/population.js"></script>
    <!-- 1. Data & Configs -->
    <script src="js/config/recipes.js"></script>
    <script src="js/config/patrons.js"></script>
    <!-- 2. Core Engine & Managers -->
    <script src="js/data/megaPack.js"></script>
    <script src="js/engine/SpriteManager.js"></script>
    <script src="js/state/player.js"></script>
    <script src="js/state/progression.js"></script>
    <script src="js/entities/patron.js"></script>
    <script src="js/entities/title.js"></script>
    <script src="js/ui/hud.js"></script>
    <script src="js/phases/brewing.js"></script>
    <script src="js/phases/taproom.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
