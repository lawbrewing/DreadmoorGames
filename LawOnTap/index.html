<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Law on Tap</title>
    <link href="https://fonts.googleapis.com/css2?family=MedievalSharp&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://lawbrewing.github.io/DreadmoorGames/LawOnTap/static/style.css">
</head>
<body>
    
    <div id="rotate-screen">
        <div style="font-size: 4rem;">🍺</div>
        <h2>BAR CLOSED</h2>
        <p>Turn your phone sideways to open.</p>
    </div>

    <div id="game-container">
        
        <div id="bar-background"></div>

        <canvas id="gameCanvas"></canvas>

        <div id="tap-0" class="tap-station" style="left: 20%;">
            <div class="tower"></div>
            <div class="glass-container">
                <div class="empty-glass"></div>
                <div class="liquid-mask">
                    <div class="full-glass-sprite"></div>
                </div>
            </div>
            <div class="handle"></div>
            <div class="hitbox" data-tap="0"></div>
        </div>

        <div id="tap-1" class="tap-station" style="left: 50%;">
            <div class="tower"></div>
            <div class="glass-container">
                <div class="empty-glass"></div>
                <div class="liquid-mask">
                    <div class="full-glass-sprite"></div>
                </div>
            </div>
            <div class="handle"></div>
            <div class="hitbox" data-tap="1"></div>
        </div>

        <div id="tap-2" class="tap-station" style="left: 80%;">
            <div class="tower"></div>
            <div class="glass-container">
                <div class="empty-glass"></div>
                <div class="liquid-mask">
                    <div class="full-glass-sprite"></div>
                </div>
            </div>
            <div class="handle"></div>
            <div class="hitbox" data-tap="2"></div>
        </div>

    </div>

    <script src="https://lawbrewing.github.io/DreadmoorGames/LawOnTap/static/game.js"></script>
</body>
</html>
